name: PR topology observation (non-authoritative)

# Shadow telemetry only. Do not add this context to required status checks.

on:
  # Not on pull_request_target. A daily idle run keeps the workflow on the
  # once-a-day clock; inspecting a PR is workflow_dispatch only.
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request number to inspect
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-topology-shadow-${{ github.event.pull_request.number || inputs.pull_request_number || github.ref }}
  cancel-in-progress: false

jobs:
  daily:
    name: Daily topology idle
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record that per-PR topology runs are off
        run: echo "PR topology is not run per pull request. Dispatch this workflow with pull_request_number to inspect one open PR."

  topology:
    name: PR topology observation (non-authoritative)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout topology auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-auditor

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: trusted-auditor/package-lock.json

      - name: Install trusted auditor dependencies
        working-directory: trusted-auditor
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Inspect open PR topology without mutation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_PR_STATE: ${{ github.event.pull_request.state }}
        run: >-
          node trusted-auditor/scripts/check-pr-topology.mjs
          --repository "$GITHUB_REPOSITORY"
          --pull-request "$PR_NUMBER"
          --json-out pr-topology.json
          --markdown-out pr-topology.md

      - name: Publish bounded shadow summary
        if: always()
        shell: bash
        run: |
          if [[ -f pr-topology.md ]]; then
            cat pr-topology.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '# PR Topology Shadow Observation V1' '' '**Shadow verdict:** SHADOW BLOCKED' '' '**Operational authority:** NONE' '' '**Atomic snapshot:** NO' '' 'This bounded observation is non-atomic, non-authoritative, and must never authorize a merge.' '' 'The bounded report was unavailable.' >> "$GITHUB_STEP_SUMMARY"
          fi
