name: CI

on:
  # PRs and the merge queue run the seconds-fast gate (Mason, Oct 28 2026:
  # merge fast, fix forward on the scheduled full run). Secret scans, the
  # generated-file check and advisory Quick typecheck stay as GATE-SPLIT left
  # them. RQ-CI-FASTGATE-2 adds a blocking typecheck plus affected tests on
  # pull_request and merge_group (p90 target under 60s). Full suites stay on
  # the six-hour master schedule, manual dispatch, and reusable workflow_call.
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened]
  merge_group:
  # Master pushes also run the seconds-fast gate only: a required "Merge Gate"
  # check run must exist on the exact commit before auto-tag can create v*; a
  # direct (non-queue) merge otherwise lands with no check runs and the tag —
  # and therefore everything downstream of it — can never be produced.
  push:
    branches: [master]
  workflow_call:
  # Full suite on master every six hours at 17 minutes past the hour.
  schedule:
    - cron: "17 */6 * * *"
    # Daily install smokes only. Distinct from the six-hour cron so the full
    # matrix can require that exact schedule and stay off this run.
    - cron: "17 11 * * *"
  # Release-gate runs (Desktop release smoke + Release suites) are started by
  # release-prep.yml once per master sha and by Auto-tag on a tag, both via
  # workflow_dispatch release_gate=true. The old half-hour schedule duplicated
  # that and is gone (CI-PHANTOM-CRON-30MIN). After both jobs succeed on
  # master, release-gate-autotag dispatches Auto-tag with this exact SHA:
  # GITHUB_TOKEN dispatches do not produce a workflow_run event.
  # Exhaustive macOS and Windows lanes stay off pull_request and merge_group.
  # Path-gated affected checks and install smokes are the per-OS gates
  # (Mason, Nov 24 2026). The six-hour run rotates the Mac exhaustive work
  # over seven daily slices (.github/scripts/ci-mac-rotation.mjs).
  workflow_dispatch:
    inputs:
      release_gate:
        description: Reuse green push CI and prepare the fast desktop release handoff
        type: boolean
        default: false
      mac_shard:
        description: Mac exhaustive slice (all = complete set, 0-6 = one daily slice)
        type: choice
        default: all
        options: [all, '0', '1', '2', '3', '4', '5', '6']
      install_smoke:
        description: Run the per-OS npm install smokes for this commit and the published release
        type: boolean
        default: false

permissions:
  contents: read

# PR runs cancel superseded revisions. merge_group, schedule, dispatch and
# workflow_call runs each get their own group (keyed by run_id) and never cancel.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate && format('phantom-release-{0}', github.ref_name) || format('ci-{0}', github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-shape:
    # Security floor: runs on every event with no if and no paths filter. Scans
    # the added lines of the candidate diff with the pinned scrub.pl and fails
    # closed on any token-shaped match outside FAKE test fixtures.
    name: Secret-shape scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: .github
          sparse-checkout-cone-mode: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch the candidate range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: node .github/scripts/ci-fetch-range.mjs
      - name: Prove secret-shape strength
        run: node --test .github/tests/secret-shape-strength.test.mjs
      - name: Scan candidate diff (fail closed)
        env:
          SCRUB_SHA256: 5aa902abedbb3bf7fa8d893b93969e247c82ff62ac26cd082215caabfb740265
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "${SCRUB_SHA256}  .github/tests/secret-shape/scrub.pl" | sha256sum --check --strict
          if [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "secret-shape base is missing" >&2
            exit 1
          fi
          if [ -z "${BASE_SHA}" ]; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --filter=blob:none --unshallow origin
            fi
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              echo "secret-shape base is missing" >&2
              exit 1
            fi
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          fi
          base="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          git diff --no-color --no-ext-diff "${base}" "${HEAD_SHA}" > "${RUNNER_TEMP}/candidate.diff"
          set +e
          perl .github/tests/secret-shape/scrub.pl --check --allow-fixtures < "${RUNNER_TEMP}/candidate.diff" > "${RUNNER_TEMP}/secret-shape.out" 2>&1
          code=$?
          set -e
          cat "${RUNNER_TEMP}/secret-shape.out"
          if [ "$code" -ne 0 ]; then
            node .github/scripts/ci-failure-summary.mjs --title "Secret-shape scan" --file "${RUNNER_TEMP}/secret-shape.out"
          fi
          exit "$code"

  quick:
    # Master-push typecheck that also publishes the protected-branch compiler
    # state fast-gate restores. On PR and merge_group it is advisory and runs
    # only the selected MCP output contract test: fast-gate, beside this job,
    # is the blocking typecheck plus affected tests there.
    # Generated-file and authority-drift checks live in their own jobs below.
    # Start alongside classification so the longest fast job has no serial wait.
    # This also checks docs-only PRs. Full suites run in the daily run.
    # A push event whose ref is a TAG is the reusable M33 verify call — it keeps
    # its own deferred-quick behavior, so the fast path is keyed on the master
    # branch ref exactly.
    name: Quick typecheck
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: |
            .github
            package.json
            package-lock.json
            tsconfig.json
            src/web-ui/tsconfig.json
            eslint.config.js
          sparse-checkout-cone-mode: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch the candidate range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: node .github/scripts/ci-fetch-range.mjs
      - name: Select MCP output contract test
        id: mcp_selection
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          ASHLR_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          ASHLR_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --test .github/tests/ci-mcp-selection.test.mjs
          node .github/scripts/ci-mcp-selection.mjs
      # Only the release-please PR may change the release version. A hand bump
      # still gets a tag and draft from auto-tag, but the release train refuses
      # it (release_message_mismatch) and it is never published (#4098, #4735).
      # PR-only: the merge queue admits a PR after its PR checks pass.
      - name: Require release-please provenance for version bumps
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          node --test .github/tests/release-version-provenance.test.mjs
          node .github/scripts/release-version-provenance.mjs
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
      # PR and merge queue: fast-gate already runs this exact typecheck as the
      # blocking check, so Quick skips its duplicate and only runs the selected
      # MCP output contract test. Master pushes still typecheck here and
      # publish the compiler state fast-gate restores (CI-PHANTOM-QUICK-DUP).
      # The sparse checkout above carries only config files. The master-push
      # typecheck and the selected MCP contract test read src/ and test/, so
      # materialize the full tree first, exactly as fast-gate does. Without
      # this, tsgo fails with TS18003 (no inputs) on every master push.
      - name: Materialize the full tree
        if: github.event_name == 'push' || steps.mcp_selection.outputs.mcp_output == 'true'
        run: |
          if [ "$(git config --bool --get core.sparseCheckout || true)" = true ]; then
            git sparse-checkout disable
          fi
      # Master pushes publish the import graph fast-gate restores. A cache
      # outage must not fail Quick: Publish dependency graph rebuilds from
      # the tree when the restored file is missing.
      - name: Restore published dependency graph
        id: push_dep_graph
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/dep-graph.json
          key: phantom-dep-graph-v2-${{ github.sha }}
          restore-keys: phantom-dep-graph-v2-
      - name: Publish dependency graph
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          CI_DEP_GRAPH: ${{ runner.temp }}/dep-graph.json
        run: node .github/scripts/ci-dep-graph.mjs update --out "$CI_DEP_GRAPH"
      - name: Save published dependency graph
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.push_dep_graph.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/dep-graph.json
          key: phantom-dep-graph-v2-${{ github.sha }}
      - name: Install dependencies
        if: github.event_name == 'push' || steps.mcp_selection.outputs.mcp_output == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Hash protected-branch compiler inputs
        id: compiler_inputs
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          const base = process.env.BASE_SHA;
          if (!/^[0-9a-f]{40}$/.test(base)) throw new Error('Invalid protected base SHA');
          const hash = createHash('sha256');
          for (const file of ['package-lock.json', 'tsconfig.json', 'src/web-ui/tsconfig.json']) {
            hash.update(file + '\0');
            hash.update(execFileSync('git', ['show', `${base}:${file}`]));
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `hash=${hash.digest('hex')}\n`);
          NODE
      - name: Restore protected-branch compiler state
        # Read the protected base's incremental graph; tsgo still validates the
        # candidate below. Only a successful master push saves compiler state.
        if: github.event_name == 'push'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            node_modules/.cache/phantom-backend.tsbuildinfo
            node_modules/.cache/phantom-web.tsbuildinfo
          key: master-typecheck-v3-${{ runner.os }}-${{ steps.compiler_inputs.outputs.hash }}-${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          # Only master publishes this family. Most-recent creation is the
          # current completed master graph, never a candidate/queue artifact.
          restore-keys: master-typecheck-v3-${{ runner.os }}-${{ steps.compiler_inputs.outputs.hash }}-master-
      - name: Core no-emit type check
        if: github.event_name == 'push'
        # Both projects enable incremental/no-emit checking in their tsconfig.
        # Keep this step name stable for release evidence consumers.
        run: |
          started=$SECONDS
          touch "$RUNNER_TEMP/compiler-check-start"
          npm run typecheck
          # An unchanged graph may legitimately retain its mtime. On master,
          # rebuild that case before publishing so no restored bytes are merely
          # relabelled as this SHA. Candidates keep the warm no-emit path.
          if [ "$GITHUB_EVENT_NAME:$GITHUB_REF" = 'push:refs/heads/master' ]; then
            rebuild=no
            for graph in node_modules/.cache/phantom-{backend,web}.tsbuildinfo; do
              if [ ! "$graph" -nt "$RUNNER_TEMP/compiler-check-start" ]; then rebuild=yes; fi
            done
            if [ "$rebuild" = yes ]; then
              rm -f node_modules/.cache/phantom-{backend,web}.tsbuildinfo
              npm run typecheck
            fi
          fi
          for graph in node_modules/.cache/phantom-{backend,web}.tsbuildinfo; do
            test -s "$graph"
            if [ "$GITHUB_EVENT_NAME:$GITHUB_REF" = 'push:refs/heads/master' ]; then
              test "$graph" -nt "$RUNNER_TEMP/compiler-check-start"
            fi
            updated=no
            if [ "$graph" -nt "$RUNNER_TEMP/compiler-check-start" ]; then updated=yes; fi
            echo "$graph: $(wc -c < "$graph") bytes; updated=$updated (tsgo incremental no-emit)" >> "$GITHUB_STEP_SUMMARY"
          done
          elapsed=$((SECONDS - started))
          echo "Incremental backend + web typecheck: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
      - name: Save protected-branch compiler state
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            node_modules/.cache/phantom-backend.tsbuildinfo
            node_modules/.cache/phantom-web.tsbuildinfo
          key: master-typecheck-v3-${{ runner.os }}-${{ steps.compiler_inputs.outputs.hash }}-${{ github.sha }}
      - name: Publish current-master compiler pointer
        # Immutable generations avoid delete/write permission. Restore searches
        # only this master-only prefix when the exact base has not saved yet.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            node_modules/.cache/phantom-backend.tsbuildinfo
            node_modules/.cache/phantom-web.tsbuildinfo
          key: master-typecheck-v3-${{ runner.os }}-${{ steps.compiler_inputs.outputs.hash }}-master-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Test MCP output contract
        if: steps.mcp_selection.outputs.mcp_output == 'true'
        run: HOME=$(mktemp -d) npm run test:ci -- test/mcp-output-efficiency.test.ts

  clean-tree:
    # Split out of Quick typecheck (RQ-PH-GATE-SPLIT-1) so a stale generated file
    # is a hard Merge Gate requirement while Quick stays advisory. The stable
    # check name is also read by Auto-tag on the exact tagged sha.
    name: Check generated files
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 1
          # Hashing uses tree ids, so a receipt hit never checks out docs.
          # A miss materializes docs and scripts in the next step.
          sparse-checkout: .github
          sparse-checkout-cone-mode: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Hash generated-file inputs
        id: clean_hash
        run: node .github/scripts/ci-fast-inputs.mjs clean-tree
      - name: Restore generated-files green result
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/ci-green/clean-tree.json
          key: phantom-ci-green-v1-clean-tree-${{ steps.clean_hash.outputs.hash }}
      - name: Decide generated-files reuse
        id: clean_reuse
        env:
          RECEIPT_HASH: ${{ steps.clean_hash.outputs.hash }}
        run: node .github/scripts/ci-green-reuse.mjs announce --job clean-tree --hash "$RECEIPT_HASH" --receipt "$RUNNER_TEMP/ci-green/clean-tree.json"
      - name: Materialize generated-file inputs
        if: steps.clean_reuse.outputs.reuse != 'true'
        run: |
          if [ "$(git config --bool --get core.sparseCheckout || true)" = true ]; then
            git sparse-checkout disable
          fi
      - name: Set up Node.js 22
        if: steps.clean_reuse.outputs.reuse != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
      # Read-only dirty diff on every PR, merge_group, and master push. Runs
      # the tracked-file generator and fails if any path changes, including
      # docs/llms.txt. No auto-commit and no path exemptions. A proven green
      # receipt for the same docs tree skips the generator; a miss runs it.
      - name: Check generated files
        env:
          RECEIPT_HASH: ${{ steps.clean_hash.outputs.hash }}
        run: |
          set -euo pipefail
          if node .github/scripts/ci-green-reuse.mjs verify --job clean-tree --hash "$RECEIPT_HASH" --receipt "$RUNNER_TEMP/ci-green/clean-tree.json"; then
            echo "reused a prior green generated-files result"
          else
            node scripts/canonical-launcher-digests.mjs --check
            node --test .github/tests/canonical-launcher-digests.test.mjs
            node scripts/generate-docs-llms.mjs
            status="$(git status --porcelain --untracked-files=normal)"
            if [ -n "$status" ]; then
              {
                printf 'generated files are stale; commit the regenerated tree:\n%s\n' "$status"
              } | tee "${RUNNER_TEMP}/generated-files.out" >&2
              node .github/scripts/ci-failure-summary.mjs --title "Check generated files" --file "${RUNNER_TEMP}/generated-files.out"
              exit 1
            fi
            node .github/scripts/ci-green-reuse.mjs write --job clean-tree --hash "$RECEIPT_HASH" --receipt "$RUNNER_TEMP/ci-green/clean-tree.json"
          fi
      - name: Save generated-files green result
        if: steps.clean_reuse.outputs.reuse != 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/ci-green/clean-tree.json
          key: phantom-ci-green-v1-clean-tree-${{ steps.clean_hash.outputs.hash }}

  authority-drift:
    # Split out of Quick typecheck (RQ-PH-GATE-SPLIT-1). Advisory for merge:
    # it is deliberately not in Merge Gate needs, so it never lengthens the
    # gate. It must still run and report on every fast event so Auto-tag and
    # the release gate can require it green on the exact sha.
    name: Check authority drift (hermetic)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Keep blobs local so expanding the sparse tree needs no lazy fetch.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: .github
          sparse-checkout-cone-mode: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Hash authority drift inputs
        id: drift_hash
        run: node .github/scripts/ci-fast-inputs.mjs authority
      - name: Restore authority drift green result
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/ci-green/authority-drift.json
          key: phantom-ci-green-v1-authority-drift-${{ steps.drift_hash.outputs.hash }}
      - name: Decide authority drift reuse
        id: drift_reuse
        env:
          RECEIPT_HASH: ${{ steps.drift_hash.outputs.hash }}
        run: node .github/scripts/ci-green-reuse.mjs announce --job authority-drift --hash "$RECEIPT_HASH" --receipt "$RUNNER_TEMP/ci-green/authority-drift.json"
      - name: Materialize the full tree
        if: steps.drift_reuse.outputs.reuse != 'true'
        run: |
          if [ "$(git config --bool --get core.sparseCheckout || true)" = true ]; then
            git sparse-checkout disable
          fi
      - name: Set up Node.js 22
        if: steps.drift_reuse.outputs.reuse != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        if: steps.drift_reuse.outputs.reuse != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Full authority shards are deferred; drift is checked here on every fast event.
      # A miss runs these two tests. A matching green receipt skips them.
      - name: Check authority drift (hermetic)
        if: steps.drift_reuse.outputs.reuse != 'true'
        run: >-
          HOME=$(mktemp -d) npm run test:ci -- --maxWorkers=1 --fileParallelism=false
          test/authority-codeowners-310b.test.ts
          test/authority-tier1-closure-310b.test.ts
      - name: Record authority drift green result
        if: steps.drift_reuse.outputs.reuse != 'true'
        env:
          RECEIPT_HASH: ${{ steps.drift_hash.outputs.hash }}
        run: node .github/scripts/ci-green-reuse.mjs write --job authority-drift --hash "$RECEIPT_HASH" --receipt "$RUNNER_TEMP/ci-green/authority-drift.json"
      - name: Save authority drift green result
        if: steps.drift_reuse.outputs.reuse != 'true'
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/ci-green/authority-drift.json
          key: phantom-ci-green-v1-authority-drift-${{ steps.drift_hash.outputs.hash }}

  fast-gate:
    # Blocking per-PR and merge-queue gate (RQ-CI-FASTGATE-2), beside Quick
    # with no needs. Typecheck plus the tests the diff selects. Docs-only
    # diffs typecheck and run zero tests. Real-io, serial-cpu and dist-bound
    # suites stay on the master full schedule. Merge-group failures write an
    # attribution report and nothing else. Quick, clean-tree, secret-shape and
    # Merge Gate keep their GATE-SPLIT roles.
    name: Fast gate (typecheck + affected tests)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # PR: base..head. merge_group: the whole batch, base_sha..head_sha.
      ASHLR_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      ASHLR_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      # Keep blobs local for dependency-graph reads and full-tree expansion.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            package.json
            package-lock.json
            tsconfig.json
            src/web-ui/tsconfig.json
            eslint.config.js
            test/config
          sparse-checkout-cone-mode: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          persist-credentials: false
      - name: Fetch the candidate range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: node .github/scripts/ci-fetch-range.mjs
      # Keyed by the checked-out head, not the run id: an exact hit skips the
      # reparse, and restore-keys picks up the graph a master push published.
      # Save is best-effort. Fork pull requests have a read-only cache token,
      # and a failed save must not fail the gate.
      - name: Restore dependency graph
        id: dep_graph
        continue-on-error: true
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/dep-graph.json
          key: phantom-dep-graph-v2-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          restore-keys: phantom-dep-graph-v2-
      - name: Update dependency graph
        env:
          CI_DEP_GRAPH: ${{ runner.temp }}/dep-graph.json
        run: node .github/scripts/ci-dep-graph.mjs update --out "$CI_DEP_GRAPH"
      - name: Save dependency graph
        if: steps.dep_graph.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/dep-graph.json
          key: phantom-dep-graph-v2-${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Select affected tests
        id: select
        env:
          CI_DEP_GRAPH: ${{ runner.temp }}/dep-graph.json
        run: |
          node --test --test-name-pattern "warm sparse checkout" .github/tests/ci-fast-select.test.mjs
          node .github/scripts/ci-fast-select.mjs
      - name: Hash typecheck and affected tests
        id: inputs
        env:
          CI_DEP_GRAPH: ${{ runner.temp }}/dep-graph.json
        run: |
          node .github/scripts/ci-fast-inputs.mjs plan
          node .github/scripts/ci-fast-inputs.mjs tests "$RUNNER_TEMP/fast-gate-plan.json"
      - name: Restore backend typecheck result
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/ci-green/typecheck-backend.json
          key: phantom-ci-green-v1-typecheck-backend-${{ steps.inputs.outputs.backend }}
      - name: Restore web typecheck result
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/ci-green/typecheck-web.json
          key: phantom-ci-green-v1-typecheck-web-${{ steps.inputs.outputs.web }}
      - name: Restore affected-test result
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/ci-green/fast-tests.json
          key: phantom-ci-green-v1-fast-tests-${{ steps.inputs.outputs.hash }}
      - name: Decide backend typecheck reuse
        id: backend_reuse
        env:
          RECEIPT_HASH: ${{ steps.inputs.outputs.backend }}
        run: node .github/scripts/ci-green-reuse.mjs announce --job typecheck-backend --hash "$RECEIPT_HASH" --receipt "$RUNNER_TEMP/ci-green/typecheck-backend.json"
      - name: Decide web typecheck reuse
        id: web_reuse
        env:
          RECEIPT_HASH: ${{ steps.inputs.outputs.web }}
        run: node .github/scripts/ci-green-reuse.mjs announce --job typecheck-web --hash "$RECEIPT_HASH" --receipt "$RUNNER_TEMP/ci-green/typecheck-web.json"
      - name: Decide affected-test reuse
        id: tests_reuse
        env:
          RECEIPT_HASH: ${{ steps.inputs.outputs.hash }}
        run: node .github/scripts/ci-green-reuse.mjs announce --job fast-tests --hash "$RECEIPT_HASH" --receipt "$RUNNER_TEMP/ci-green/fast-tests.json"
      - name: Materialize the full tree
        if: steps.backend_reuse.outputs.reuse != 'true' || steps.web_reuse.outputs.reuse != 'true' || (steps.select.outputs.mode != 'docs' && steps.tests_reuse.outputs.reuse != 'true')
        run: |
          if [ "$(git config --bool --get core.sparseCheckout || true)" = true ]; then
            git sparse-checkout disable
          fi
      - name: Set up Node.js 22
        if: steps.backend_reuse.outputs.reuse != 'true' || steps.web_reuse.outputs.reuse != 'true' || (steps.select.outputs.mode != 'docs' && steps.tests_reuse.outputs.reuse != 'true')
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        if: steps.backend_reuse.outputs.reuse != 'true' || steps.web_reuse.outputs.reuse != 'true' || (steps.select.outputs.mode != 'docs' && steps.tests_reuse.outputs.reuse != 'true')
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Hash protected-branch compiler inputs
        id: compiler_inputs
        if: steps.backend_reuse.outputs.reuse != 'true' || steps.web_reuse.outputs.reuse != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          const base = process.env.BASE_SHA;
          if (!/^[0-9a-f]{40}$/.test(base)) throw new Error('Invalid protected base SHA');
          const hash = createHash('sha256');
          for (const file of ['package-lock.json', 'tsconfig.json', 'src/web-ui/tsconfig.json']) {
            hash.update(file + '\0');
            hash.update(execFileSync('git', ['show', `${base}:${file}`]));
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `hash=${hash.digest('hex')}\n`);
          NODE
      - name: Restore protected-branch compiler state
        # Read-only. Same master-only family Quick publishes. No compiler-state save here.
        if: steps.backend_reuse.outputs.reuse != 'true' || steps.web_reuse.outputs.reuse != 'true'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            node_modules/.cache/phantom-backend.tsbuildinfo
            node_modules/.cache/phantom-web.tsbuildinfo
          key: master-typecheck-v3-${{ runner.os }}-${{ steps.compiler_inputs.outputs.hash }}-${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          restore-keys: master-typecheck-v3-${{ runner.os }}-${{ steps.compiler_inputs.outputs.hash }}-master-
      - name: Core no-emit type check
        # Keep this step name stable for release evidence consumers.
        # Both receipts must match or the real check runs. One matching
        # receipt can limit the run to the other project.
        env:
          BACKEND_REUSE: ${{ steps.backend_reuse.outputs.reuse }}
          WEB_REUSE: ${{ steps.web_reuse.outputs.reuse }}
          PROJECTS: ${{ steps.inputs.outputs.projects }}
          BACKEND_HASH: ${{ steps.inputs.outputs.backend }}
          WEB_HASH: ${{ steps.inputs.outputs.web }}
        run: |
          started=$SECONDS
          if node .github/scripts/ci-green-reuse.mjs verify --job typecheck-backend --hash "$BACKEND_HASH" --receipt "$RUNNER_TEMP/ci-green/typecheck-backend.json" \
            && node .github/scripts/ci-green-reuse.mjs verify --job typecheck-web --hash "$WEB_HASH" --receipt "$RUNNER_TEMP/ci-green/typecheck-web.json"; then
            echo "Reused prior green typecheck results" >> "$GITHUB_STEP_SUMMARY"
          else
            case "$PROJECTS" in
              web)
                if node .github/scripts/ci-green-reuse.mjs verify --job typecheck-backend --hash "$BACKEND_HASH" --receipt "$RUNNER_TEMP/ci-green/typecheck-backend.json"; then
                  npm run typecheck:web
                  node .github/scripts/ci-green-reuse.mjs write --job typecheck-web --hash "$WEB_HASH" --receipt "$RUNNER_TEMP/ci-green/typecheck-web.json"
                else
                  npm run typecheck
                  node .github/scripts/ci-green-reuse.mjs write --job typecheck-backend --hash "$BACKEND_HASH" --receipt "$RUNNER_TEMP/ci-green/typecheck-backend.json"
                  node .github/scripts/ci-green-reuse.mjs write --job typecheck-web --hash "$WEB_HASH" --receipt "$RUNNER_TEMP/ci-green/typecheck-web.json"
                fi
                ;;
              backend)
                if node .github/scripts/ci-green-reuse.mjs verify --job typecheck-web --hash "$WEB_HASH" --receipt "$RUNNER_TEMP/ci-green/typecheck-web.json"; then
                  npx --no-install tsgo --noEmit
                  node .github/scripts/ci-green-reuse.mjs write --job typecheck-backend --hash "$BACKEND_HASH" --receipt "$RUNNER_TEMP/ci-green/typecheck-backend.json"
                else
                  npm run typecheck
                  node .github/scripts/ci-green-reuse.mjs write --job typecheck-backend --hash "$BACKEND_HASH" --receipt "$RUNNER_TEMP/ci-green/typecheck-backend.json"
                  node .github/scripts/ci-green-reuse.mjs write --job typecheck-web --hash "$WEB_HASH" --receipt "$RUNNER_TEMP/ci-green/typecheck-web.json"
                fi
                ;;
              *)
                npm run typecheck
                node .github/scripts/ci-green-reuse.mjs write --job typecheck-backend --hash "$BACKEND_HASH" --receipt "$RUNNER_TEMP/ci-green/typecheck-backend.json"
                node .github/scripts/ci-green-reuse.mjs write --job typecheck-web --hash "$WEB_HASH" --receipt "$RUNNER_TEMP/ci-green/typecheck-web.json"
                ;;
            esac
          fi
          echo "Incremental backend + web typecheck: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Run affected tests
        if: steps.select.outputs.mode != 'docs'
        env:
          TESTS_HASH: ${{ steps.inputs.outputs.hash }}
        run: |
          started=$SECONDS
          if node .github/scripts/ci-green-reuse.mjs verify --job fast-tests --hash "$TESTS_HASH" --receipt "$RUNNER_TEMP/ci-green/fast-tests.json"; then
            echo "reused a prior green affected-test result"
          else
            node .github/scripts/ci-fast-run.mjs
            node .github/scripts/ci-green-reuse.mjs write --job fast-tests --hash "$TESTS_HASH" --receipt "$RUNNER_TEMP/ci-green/fast-tests.json"
          fi
          echo "Affected tests: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Save backend typecheck receipt
        if: success() && steps.backend_reuse.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/ci-green/typecheck-backend.json
          key: phantom-ci-green-v1-typecheck-backend-${{ steps.inputs.outputs.backend }}
      - name: Save web typecheck receipt
        if: success() && steps.web_reuse.outputs.reuse != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/ci-green/typecheck-web.json
          key: phantom-ci-green-v1-typecheck-web-${{ steps.inputs.outputs.web }}
      - name: Save affected-test receipt
        if: success() && steps.tests_reuse.outputs.reuse != 'true' && steps.select.outputs.mode != 'docs' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/ci-green/fast-tests.json
          key: phantom-ci-green-v1-fast-tests-${{ steps.inputs.outputs.hash }}
      - name: Attribute merge group failure
        if: failure() && github.event_name == 'merge_group'
        run: node .github/scripts/ci-fast-attribute.mjs
      - name: Upload merge group attribution
        # actions: write is not granted. A refused upload must not replace the
        # test failure, and it never runs on a green pull request.
        if: failure() && github.event_name == 'merge_group'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merge-group-attribution
          path: merge-group-attribution.json
          if-no-files-found: ignore
          retention-days: 7

  classify:
    name: Classify PR site lane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      os_sensitive: ${{ steps.os.outputs.os_sensitive }}
      xplat_install: ${{ steps.paths.outputs.xplat_install }}
      release_gate: ${{ github.event_name == 'workflow_dispatch' && inputs.release_gate == true }}
      mac_slice: ${{ steps.mac.outputs.mac_slice }}
      mac_general_exclude: ${{ steps.mac.outputs.mac_general_exclude }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ancestry for behind-PR validation is fetched on demand and unshallowed
          # if the shallow window cannot see the merge base.
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: .github
          sparse-checkout-cone-mode: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch the candidate range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: node .github/scripts/ci-fetch-range.mjs
      - name: Bind candidate source
        env:
          ASHLR_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-source-binding.mjs
      - name: Classify exact ecosystem-only PR
        id: lane
        env:
          ASHLR_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ASHLR_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-site-lane.mjs
      - name: Classify OS-sensitive paths
        id: os
        env:
          EVENT_NAME: ${{ github.event_name }}
          ASHLR_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          ASHLR_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-os-paths.mjs
      # token empty: git diff only. pull-requests permission stays unset.
      # signer_proof is computed and unused; Core owns that job.
      - name: Apply shared path filters
        id: paths
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ''
          filters: .github/path-filters/phantom.yml
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      - name: Select daily Mac rotation
        id: mac
        env:
          EVENT_NAME: ${{ github.event_name }}
          MAC_SHARD_INPUT: ${{ github.event.inputs.mac_shard }}
        run: node .github/scripts/ci-mac-rotation.mjs plan

