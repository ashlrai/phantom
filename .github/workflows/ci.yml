name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]
    # ready_for_review starts the Mac lanes that a draft PR defers. labeled lets
    # `ci:full-os` start a full-OS run; the PR concurrency group cancels the
    # superseded run.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  # A merge queue reruns the full lane on the queued merge commit.
  merge_group:
  workflow_call:
  # Push to master skips the macOS and Windows service lanes; this nightly run
  # on master runs the full matrix, Mac exhaustive included.
  schedule:
    - cron: "41 7 * * *"

permissions:
  contents: read

# Candidate checkouts must match the original GitHub event's tree before gates.
# Superseded PR revisions can stop safely. Each master push gets its own group
# keyed by commit, so a run waiting on a Mac runner never cancels or blocks the
# next push's run: one shared ref group holds a single pending run and cancels
# the one it replaces, which left master with no completed post-merge Mac run.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: Classify PR site lane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      full_os: ${{ steps.os.outputs.full_os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind candidate source
        env:
          ASHLR_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-source-binding.mjs
      - name: Classify exact ecosystem-only PR
        id: lane
        env:
          ASHLR_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ASHLR_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-site-lane.mjs
      # PRs run the Windows portability and macOS isolated/shared legs only when
      # platform code changes or the PR has the `ci:full-os` label. Every other
      # event (master push, nightly schedule, merge queue, workflow_call) runs
      # every leg. Merge Gate treats the deferred legs as skipped, not failed.
      - name: Classify platform-sensitive PR
        id: os
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_OS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full-os') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          full=true
          if [ "$EVENT_NAME" = pull_request ] && [ "$FULL_OS_LABEL" != true ]; then
            full=false
            files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA") || { full=true; files=''; }
            # Platform paths: CI itself, installers and platform scripts, native
            # and desktop code, daemon/runtime services, build, test and
            # dependency config (every package.json and lockfile), and any path
            # named for an OS.
            re='^(\.github/workflows/ci\.yml|\.github/scripts/|install\.sh|scripts/.*\.(sh|ps1)$|desktop/src-tauri/|tools/custody/|src/core/daemon/|src/core/local-runtime/|test/helpers/)|(^|/)(package(-lock)?\.json|npm-shrinkwrap\.json|bun\.lockb?|pnpm-lock\.yaml|yarn\.lock|Cargo\.(toml|lock)|tsconfig[^/]*\.json|vitest\.config[^/]*)$|(windows|win32|darwin|macos|launchd|platform|portab)'
            # OS-sensitive source: platform checks, OS name literals, Windows or
            # POSIX path semantics, and Rust cfg gates.
            content="process\.platform|platform\(\)|[\"'\`](win32|darwin)[\"'\`]|path\.(sep|win32|posix|delimiter)\b|\b(sep|win32|posix|delimiter)\b[^;]*from [\"'](node:)?path[\"']|cfg!?\((windows|unix|target_os)"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              if printf '%s\n' "$f" | grep -Eqi "$re"; then full=true; echo "platform path: $f"; break; fi
              # Tests named in an OS leg.
              if grep -qF "$f" .github/workflows/ci.yml; then full=true; echo "OS-leg test: $f"; break; fi
              if [ -f "$f" ] && grep -Eq "$content" "$f"; then full=true; echo "OS-sensitive source: $f"; break; fi
              # Removing the last platform check is platform-sensitive too.
              if git diff "$BASE_SHA...$HEAD_SHA" -- "$f" | grep -E '^-[^-]' | grep -Eq "$content"; then full=true; echo "OS-sensitive removal: $f"; break; fi
              # Added or removed diff lines too, so deleting the last platform
              # check (or a whole file that had one) still runs the OS legs.
              if git diff -U0 "$BASE_SHA...$HEAD_SHA" -- "$f" | grep -E '^[-+]' | grep -Ev '^(\+\+\+|---) ' | grep -Eq "$content"; then full=true; echo "OS-sensitive diff line: $f"; break; fi
            done <<< "$files"
          fi
          echo "full_os=$full" >> "$GITHUB_OUTPUT"
          echo "full OS legs: $full"

  site:
    name: Site PR (ecosystem)
    needs: classify
    if: needs.classify.outputs.lane == 'site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind candidate source
        env:
          ASHLR_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-source-binding.mjs
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check ecosystem JavaScript syntax
        run: node --check site/assets/star-history.js && node --check site/assets/ecosystem.js
      - name: Test fail-closed lane classification
        run: node --test .github/tests/ci-site-lane.test.mjs
      - name: Smoke-test ecosystem markup, data, and controls
        run: npm run test:ci -- test/site-ecosystem-smoke.test.ts

  docs:
    # Docs-only PRs (every changed path is Markdown outside code and test trees,
    # or under docs/) cannot change runtime behaviour, so they skip the Ubuntu,
    # Windows and Mac matrix. They still run the documentation checks and every
    # Markdown-reading test that does not need a built dist/. Tests that import
    # test/helpers/require-built-dist.js need npm run build, so the selector
    # leaves them for the full lane, which builds first. The Merge Gate still reports.
    name: Docs PR (docs-only)
    needs: classify
    if: needs.classify.outputs.lane == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind candidate source
        env:
          ASHLR_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-source-binding.mjs
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test fail-closed lane classification
        run: node --test .github/tests/ci-site-lane.test.mjs
      - name: Check documentation (docs lane)
        run: npm run check:docs
      - name: Run tests that read Markdown
        run: |
          mapfile -t files < <(node .github/scripts/select-docs-markdown-tests.mjs)
          if [ "${#files[@]}" -eq 0 ]; then echo "no Markdown-reading tests found" >&2; exit 1; fi
          npm run test:ci -- "${files[@]}"

  ci:
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    # Node 22.15 is the hard minimum — install.sh and CONTRIBUTING.md both enforce it.
    # Ubuntu is the exhaustive authority, partitioned by Vitest's deterministic
    # file sharding so the full suite has margin below the hermetic hard cap.
    # Windows runs named portability contracts over fleet durability,
    # verification, merge authority, handoff, telemetry, and watchdog surfaces.
    name: CI (Node 22, ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu, authority 1/3
            test_args: "--shard=1/3 --exclude=test/m342.dispatch-production-ledger.test.ts"
          - os: ubuntu-latest
            label: ubuntu, authority 2/3
            test_args: "--shard=2/3 --exclude=test/m342.dispatch-production-ledger.test.ts"
          - os: ubuntu-latest
            label: ubuntu, authority 3/3
            node_version: "22.15.0"
            test_args: "--shard=3/3 --exclude=test/m342.dispatch-production-ledger.test.ts"
    runs-on: ${{ matrix.os }}
    env: &node_ci_environment
      ASHLR_VITEST_TEST_TIMEOUT_MS: ${{ matrix.os == 'windows-latest' && '30000' || '5000' }}
      ASHLR_RUN_NATIVE_LAUNCHD_TEST: ${{ matrix.native_launchd || '0' }}

    steps: &node_ci_steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: some real-io tests read pinned historical seed commits
          # (the backlog-marker evaluator's baseline), absent from a shallow clone.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind candidate source
        env:
          ASHLR_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-source-binding.mjs

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version || '22' }}
          cache: "npm"

      # Native-profile preparation refuses a group/other-writable runtime
      # (src/core/resources/native-profile.ts executable()). The hosted
      # Linux tool cache ships the Node binary group-writable, which made
      # every native-profile test fail closed on ubuntu only.
      - name: Drop group/other write from the hosted Node runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node_bin="$(node -p 'require("node:fs").realpathSync(process.execPath)')"
          stat -c '%a %U:%G %n' "$node_bin"
          chmod go-w -- "$node_bin"
          stat -c '%a %U:%G %n' "$node_bin"

      # Custody checks (worker-home parent, preparation Git, built-in
      # evaluator install) refuse group/world-writable ancestors. On hosted
      # Linux, os.tmpdir() is the sticky world-writable /tmp, so every test
      # rooted there fails closed; macOS runners already get a per-user
      # private temp root. Give Linux the same shape, outside the real
      # $HOME (RUNNER_TEMP lives under /home/runner, which the HOME-isolation
      # guards correctly treat as the real developer home) and away from the
      # hosted /opt, which is mode 0777 on GitHub runners.
      - name: Use a private temp root on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          private_tmp="/ashlr-private-tmp"
          sudo install -d -m 0700 -o "$(id -un)" -g "$(id -gn)" -- "$private_tmp"
          for dir in "$private_tmp" /; do
            stat -c '%a %U:%G %n' "$dir"
          done
          echo "TMPDIR=$private_tmp" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # Check publication contracts once, before the producer's build. Every
      # module still runs in the exhaustive Ubuntu and Mac qualification.
      - name: Check publication contracts (hermetic)
        if: matrix.label == 'ubuntu, authority 1/3'
        run: npm run check:release

      # Reject generated ownership drift before expensive builds and tests.
      # Every platform still runs all of its assigned checks afterward.
      - name: Check generated authority ownership (hermetic)
        run: >-
          npm run test:ci -- --maxWorkers=1 --fileParallelism=false
          test/authority-codeowners-310b.test.ts

      # Web types run once at the minimum Node version. Every full Build starts
      # with the core TypeScript compiler, so a preceding core no-emit pass
      # would repeat the same check. All assigned tests still run below.
      - name: Typecheck
        if: matrix.label == 'ubuntu, authority 3/3'
        run: npm run typecheck:web

      - name: Lint
        if: matrix.label == 'ubuntu, authority 3/3'
        run: npm run lint

      - name: Check documentation
        if: matrix.label == 'ubuntu, authority 3/3'
        run: npm run check:docs

      - name: Build
        run: npm run build

      # Save all generated bytes immediately after the successful build, before
      # tests can touch dist. Pack smoke later checks this exact same-job snapshot.
      - name: Capture pack smoke build snapshot
        if: matrix.label == 'ubuntu, authority 1/3'
        shell: bash
        run: |
          set -euo pipefail
          npm run check:pack-contracts
          snapshot="$(node .github/scripts/ci-pack-smoke.mjs capture "$RUNNER_TEMP")"
          printf 'ASHLR_PACK_SMOKE_SNAPSHOT=%s\n' "$snapshot" >> "$GITHUB_ENV"
          npm run check:first-paint:built
          # Pack once before the full suites; fail on the actual consumer archive
          # limits now, then retain these exact original bytes for late acceptance.
          record_sha="$(node .github/scripts/ci-pack-smoke.mjs prepare "$snapshot")"
          printf 'ASHLR_PACK_SMOKE_RECORD_SHA256=%s\n' "$record_sha" >> "$GITHUB_ENV"

      # Surface UI regressions before the exhaustive backend partition. This
      # is the same complete web suite, run once in its existing Ubuntu job.
      - name: Test web operator console
        if: matrix.label == 'ubuntu, authority 1/3'
        id: web
        run: node .github/scripts/ci-qualification-lane.mjs web

      # Diagnostic data stays outside accepted coverage and cannot replace a gate.
      - name: Observe advisory web impact shadow
        if: matrix.label == 'ubuntu, authority 1/3'
        id: shadow
        continue-on-error: true
        timeout-minutes: 2
        env:
          ASHLR_SHADOW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node .github/scripts/ci-impact-shadow.mjs web "${{ steps.web.outputs.lane_dir }}"
      - name: Upload advisory web impact shadow
        if: success() && steps.shadow.outputs.shadow_dir != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantom-impact-shadow-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.shadow.outputs.shadow_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Test (hermetic)
        # scripts/test-ci.mjs isolates HOME from real ~/.ashlr/ state and adds
        # inactivity and hard-runtime watchdogs. Windows portability partitions run
        # serially in independent checkouts so they cannot share mutable state.
        # This is the canonical CI invocation documented in CONTRIBUTING.md.
        run: npm run test:ci -- ${{ matrix.test_args }}

      - name: Test complete dispatch production ledger (hermetic)
        if: matrix.label == 'ubuntu, authority 3/3'
        # Keep all 2048 real receipt files and original per-case deadlines. The
        # complete file runs once after the three-way partition, in a fresh HOME,
        # without a second real-I/O worker competing for its filesystem budget.
        run: >-
          npm run test:ci -- --maxWorkers=1 --fileParallelism=false
          test/m342.dispatch-production-ledger.test.ts

      - name: Test native ACL enrollment fences (hermetic)
        if: matrix.label == 'windows, portability overflow'
        # Keep native ACL probes and Pulse durable-I/O timing contracts serial.
        # Keep them out of Vitest file parallelism so a loaded runner cannot turn
        # the adapter's two bounded 5-second attempts into a false bootstrap failure.
        run: >-
          npm run test:ci -- --maxWorkers=1 --no-file-parallelism
          test/m403.automerge-mutation-fence.test.ts
          test/m419.remote-handoff-intent.test.ts
          test/m418.pulse-quiescence.test.ts

      - name: Clean disposable native launchd fixture
        if: always() && matrix.os == 'macos-latest'
        run: node scripts/cleanup-launchd-test.mjs

      - name: Test native alias authority (hermetic)
        if: matrix.os == 'macos-latest' || matrix.label == 'windows, portability 2/3'
        run: npm run test:ci -- test/m426.sandbox-reservation-identity.test.ts test/h7.rollback.test.ts

      - name: Test npm runtime snapshot authority (hermetic)
        if: matrix.os == 'macos-latest'
        run: npm run test:ci -- test/npm-cli-launch.test.ts

      - name: Test native path and lifecycle authority (hermetic)
        if: matrix.label == 'windows, portability 1/3'
        run: >-
          node scripts/test-native-path-lifecycle.mjs --
          test/h1.fixture.test.ts test/h4.sandbox-enrollment-kill.test.ts
          test/m165.self-heal.test.ts test/m201.daemon-loop.test.ts
          test/m22.backlog.test.ts test/m229.goal-engine-trio.test.ts
          test/m310.queued-autonomy-work.test.ts
          test/m342.dispatch-production-ledger.test.ts
          test/m362.repair-handoff-journal.test.ts
          test/m360.generated-repair-lifecycle.test.ts
          test/m353.dispatch-manifest.test.ts test/m84.goal-direct.test.ts
          -t "relocates homedir\(\) to the fresh tmp HOME while active|cleanup\(\) restores the prior HOME, USERPROFILE, and ASHLR_HOME exactly|3.8 secures a fresh Windows authority root before enrollment|3.9 refuses without rewriting a pre-existing permissive Windows authority root|3.10 refuses a permissive pre-existing Windows fence directory|retires an uncommitted intent so a cross-day retry can acquire authority|materializes exact failure receipts for treatment-free capture and proposal repair lineage|recovers a failure append crash without duplicating its authoritative raw event|recovers one exact failure append beyond the analytics partition read bound|fails closed when a crashed failure append partition suffers replacement|fails closed when a crashed failure append partition suffers truncation|fails closed when a crashed failure append partition suffers mutation|bounds and crash-recovers 2,048 same-generation failures with batched assurance|recovers an interrupted retention manifest for an exact failure-receipt artifact|recovers an interrupted retention manifest for an exact failure-intent artifact|establishes exact private DACLs for attempt authority writes|exact-inspects receipt directory DACLs during pure authority reads|rejects owner-safe but non-exact Windows ACLs before parsing treatment authority|establishes exact private DACLs for treatment receipt, retention, and protocol writes|consumes protocol v5 emitted by the real dispatch writer|publishes an ordinal-2 retained proof at the writer retention cutoff|accepts an exact-inspected v2 receipt tombstone after the live receipt is retained|keeps a proven converted witness pending until exact immutable publication|retries converted publication after receipt storage is repaired|treats exact immutable publication replay as idempotent|establishes exact private DACLs for lifecycle treatment receipt and existing retention storage|journal activation authority: canonicalizes UUID casing before persistence and lookup|journal activation authority: quarantines UUID case-variant timestamp collisions|journal activation authority: reports the latest same-generation recurrence|journal activation authority: rejects recurrence authority when its immutable anchor parent is missing|journal activation authority: preserves unbound v2 rows written before activation|journal activation authority: quarantines unbound v2 rows written after activation|journal activation authority: reconciles a file-durable append crash before parent settlement|preserves the journal-wide high-water through compaction and rejects a stale writer generation|rejects a distinct writer id claiming the high-water activation instant|rejects an activation id that mutates its timestamp|degrades summary when an active-epoch recurrence loses its parent|tracks the active writer epoch without moving the immutable generation anchor|keeps the first exact route tuple as the immutable generation anchor|does not let a backdated recurrence replace the first durable anchor|quarantines a malformed claimed id across compaction and later replay|projects the immutable first v2 attempt while compaction preserves recurrence history|keeps compacted history able to quarantine a changed old replay|quarantines an exact parent with a conflicting backend/tier sibling|reports the true latest authority timestamp across current-activation generations|preserves generation proof across an intentional writer activation rollover|accepts a current physical alias only for an exactly canonical enrolled path|proves an old complete sequence from a physical attempt receipt without scanning global partitions|A0a: retargeted legacy enrollment aliases are not counted, scanned, or dispatched|A0b: a temporarily missing exact canonical enrollment degrades the tick|keeps the healthy full snapshot when an exact canonical enrollment is temporarily missing|fails closed on a legacy lexical enrollment row after its alias is retargeted|correlates a canonical proposal for a symlink-bound goal|correlates a canonical proposal for a symlink project caller|correlates a canonical swarm proposal for a lexical project caller|persists physical proposal repo identity and rejects legacy alias authority|does not derive or journal repair authority from an invalid raw repo identity|persists physical repo identity and rejects legacy lexical or linked aliases|idempotently rejects relative and secret-shaped raw repo identities without fallback rows|idempotently rejects relative and secret-shaped repo identities without unknown or cwd rows|persists physical assignment repo identity and rejects legacy alias authority"

      # M33: keep the published exports map honest — pack the tarball, install
      # it into a clean dir, and exercise the bin + the ./types entry point.
      # M83: run once on the first Ubuntu authority shard. The tarball-exports
      # check is OS-independent, and the bash heredoc is not worth porting to Windows.
      - name: Pack smoke (exports map)
        if: matrix.label == 'ubuntu, authority 1/3'
        shell: bash
        run: |
          set -euo pipefail
          # Reuse the original early pack; source/build/archive drift refuses.
          # Never run npm pack or prepack again after the suites.
          SOURCE_DIR="$PWD"
          SMOKE_DIR=$(mktemp -d)
          cleanup() {
            status=$?
            trap - EXIT
            rm -rf -- "$SMOKE_DIR" || status=1
            node "$SOURCE_DIR/.github/scripts/ci-pack-smoke.mjs" cleanup "$ASHLR_PACK_SMOKE_SNAPSHOT" || status=1
            exit "$status"
          }
          trap cleanup EXIT
          PACK_DETAILS="$(node .github/scripts/ci-pack-smoke.mjs reuse-details "$ASHLR_PACK_SMOKE_SNAPSHOT")"
          TARBALL="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).path)' "$PACK_DETAILS")"
          SDK_PACKAGE="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).packageName)' "$PACK_DETAILS")"
          cd "$SMOKE_DIR"
          npm init -y > /dev/null
          npm install "$TARBALL" > /dev/null
          ./node_modules/.bin/ashlr help > /dev/null
          node -e 'import(process.argv[1] + "/types").then(() => console.log("exports map ok"))' "$SDK_PACKAGE"
          node -e 'import(process.argv[1] + "/core").then((m) => { if (typeof m.loadConfig !== "function") throw new Error("core surface broken"); console.log("core surface ok"); })' "$SDK_PACKAGE"
          cd "$SOURCE_DIR"
          node .github/scripts/ci-pack-smoke.mjs verify "$ASHLR_PACK_SMOKE_SNAPSHOT"
          test "$(node .github/scripts/ci-pack-smoke.mjs reuse "$ASHLR_PACK_SMOKE_SNAPSHOT")" = "$TARBALL"
          handoff="$RUNNER_TEMP/ashlr-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node scripts/hosted-build-artifact.mjs capture --root "$SOURCE_DIR" --sha "$ASHLR_CI_SOURCE_SHA" --snapshot "$ASHLR_PACK_SMOKE_SNAPSHOT" --package-tarball "$TARBALL" --out "$handoff" --reports "${{ steps.web.outputs.lane_dir }}"
          printf 'ASHLR_CI_BUILD_HANDOFF=%s\n' "$handoff" >> "$GITHUB_ENV"

      - name: Upload qualified build handoff
        if: matrix.label == 'ubuntu, authority 1/3'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ashlr-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ASHLR_CI_BUILD_HANDOFF }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  ci-windows:
    # Windows portability contracts. PRs run them only for platform-sensitive
    # changes or the `ci:full-os` label (classify `full_os`); every other event
    # runs them. Merge Gate accepts a skip only when full_os is false.
    needs: classify
    if: needs.classify.outputs.lane == 'full' && needs.classify.outputs.full_os == 'true'
    name: CI (Node 22, ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows, portability 1/3
            test_args: >-
              test/setup/home.test.ts test/classify.test.ts
              test/m2.doctor.test.ts test/m3.tools-registry.test.ts
              test/m18.editors.test.ts
              test/m43.verify-commands.test.ts
              test/m113.coordinator-wire.test.ts test/m373.directory-durability.test.ts
              test/m395.effect-terminal-retention.test.ts
              test/m404.policy-result-surfaces.test.ts
              test/m428.goal-source-quality.test.ts
              test/m409.engine-execution-mutation-fence.test.ts
              test/m410.policy-opposing-race.test.ts
              test/m414.local-store-lock-unknown-owner.test.ts
              test/m415.policy-durability-races.test.ts
              test/m422.policy-transaction-recovery.test.ts
              test/m425.policy-startup-recovery.test.ts
              test/m416.local-store-lock-handoff.test.ts
          - os: windows-latest
