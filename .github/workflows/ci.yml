        run: node .github/scripts/ci-mac-rotation.mjs run isolated
      - name: Clean disposable native launchd fixture
        if: always()
        run: node scripts/cleanup-launchd-test.mjs

  native-macos-broker-foundation:
    name: Native macOS broker foundation (Rust 1.97.1)
    # Own checkout and fixtures remain independent evidence. Queues with the
    # isolated lane rather than after it, so a PR waits on one Mac queue, not two.
    needs: classify
    if: needs.classify.outputs.lane == 'full' && github.event_name != 'push' && github.event_name != 'pull_request' && github.event_name != 'merge_group' && needs.classify.outputs.release_gate != 'true' && (github.event_name != 'schedule' || github.event.schedule == '17 */6 * * *')
    runs-on: macos-latest
    timeout-minutes: 20
    # Full-audit FIFO pools are shared across runs; release jobs use other groups.
    # FIFO preserves up to 100 pending jobs per pool; GitHub cancels overflow.
    concurrency:
      group: ci-full-mac-shared-and-broker
      queue: max
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind candidate source
        env:
          ASHLR_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-source-binding.mjs

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      # Compiled cache contents are executable. Only successful protected-master
      # pushes populate this private CI namespace; PRs restore but never save.
      - name: Fingerprint native compile inputs
        id: cargo-inputs
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const { appendFileSync, lstatSync, readFileSync } = require('node:fs');
          const digest = (value) => createHash('sha256').update(value).digest('hex');
          const command = (file, args) => {
            const value = execFileSync(file, args, { encoding: 'utf8', maxBuffer: 1024 * 1024 }).trim();
            if (!value) throw new Error('missing native compiler probe');
            return value;
          };
          const nativeInput = (file) => [
            '.github/workflows/ci.yml', 'Cargo.toml', 'Cargo.lock',
            '.cargo/config', '.cargo/config.toml', 'rust-toolchain', 'rust-toolchain.toml',
            'desktop/src-tauri/Cargo.toml', 'desktop/src-tauri/Cargo.lock',
            'desktop/src-tauri/build.rs', 'desktop/src-tauri/tauri.conf.json',
            'desktop/src-tauri/Info.plist', 'desktop/src-tauri/Entitlements.plist',
            'desktop/src-tauri/.cargo/config', 'desktop/src-tauri/.cargo/config.toml',
            'desktop/src-tauri/rust-toolchain', 'desktop/src-tauri/rust-toolchain.toml',
          ].includes(file) ||
            file.startsWith('desktop/src-tauri/src/') ||
            file.startsWith('desktop/src-tauri/capabilities/') ||
            file.startsWith('desktop/src-tauri/icons/');
          // git's index supplies membership: outputs and untracked private files
          // cannot enter the fingerprint or be read by this step.
          const files = command('git', ['ls-files', '-z']).split('\0').filter(nativeInput).sort();
          for (const required of ['.github/workflows/ci.yml', 'desktop/src-tauri/Cargo.toml',
            'desktop/src-tauri/Cargo.lock', 'desktop/src-tauri/build.rs', 'desktop/src-tauri/tauri.conf.json']) {
            if (!files.includes(required)) throw new Error('missing tracked native input');
          }
          const source = createHash('sha256');
          for (const file of files) {
            if (!lstatSync(file).isFile()) throw new Error('nonregular native input');
            source.update(JSON.stringify([file, digest(readFileSync(file))]));
          }
          // Output-directory/wrapper overrides would change the cached artifact
          // domain. They are not used by this gate and must not share its key.
          for (const field of ['CARGO_TARGET_DIR', 'CARGO_BUILD_BUILD_DIR', 'RUSTC_WRAPPER', 'RUSTC_WORKSPACE_WRAPPER']) {
            if (process.env[field]) throw new Error('unsupported native cache output or wrapper');
          }
          const rust = command('rustc', ['-vV']);
          const host = rust.match(/^host: (.+)$/m)?.[1];
          if (!host || !process.env.ImageOS || !process.env.ImageVersion) throw new Error('missing native compiler/image identity');
          const flags = ['RUSTFLAGS', 'CARGO_ENCODED_RUSTFLAGS', 'CARGO_BUILD_RUSTFLAGS',
            'CARGO_BUILD_TARGET', 'CC', 'CFLAGS', 'CXX', 'CXXFLAGS', 'CPPFLAGS', 'LDFLAGS',
            'SDKROOT', 'MACOSX_DEPLOYMENT_TARGET'].map((field) => [field, process.env[field] ?? '']);
          flags.push(...Object.entries(process.env).filter(([field]) =>
            /^CARGO_PROFILE_(DEV|TEST)_/.test(field) || /^CARGO_TARGET_[A-Z0-9_]+_(LINKER|RUSTFLAGS)$/.test(field)).sort());
          const environment = digest(JSON.stringify({
            rust, cargo: command('cargo', ['-V']), host,
            os: command('sw_vers', ['-productVersion']), arch: command('uname', ['-m']),
            image: [process.env.ImageOS, process.env.ImageVersion],
            xcode: command('xcodebuild', ['-version']),
            developer: command('xcode-select', ['-p']),
            sdk: [command('xcrun', ['--show-sdk-version']), command('xcrun', ['--show-sdk-path'])],
            flags, invocation: 'host-lib-locked-default-features-dev-test',
          }));
          const key = `phantom-ci-broker-cargo-v1-${environment}-${source.digest('hex')}`;
          appendFileSync(process.env.GITHUB_OUTPUT, `key=${key}\n`);
          NODE

      - name: Restore native compilation cache
        id: cargo-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: desktop/src-tauri/target/debug/
          key: ${{ steps.cargo-inputs.outputs.key }}

      # GitHub may return a primary-key prefix match. It is not this exact
      # compilation domain; refuse before invoking any cached executable.
      - name: Validate native cache identity
        env:
          EXPECTED_CARGO_CACHE_KEY: ${{ steps.cargo-inputs.outputs.key }}
          PRIMARY_CARGO_CACHE_KEY: ${{ steps.cargo-cache.outputs.cache-primary-key }}
          RESTORED_CARGO_CACHE_KEY: ${{ steps.cargo-cache.outputs.cache-matched-key }}
        run: |
          node <<'NODE'
          const { EXPECTED_CARGO_CACHE_KEY: expected, PRIMARY_CARGO_CACHE_KEY: primary,
            RESTORED_CARGO_CACHE_KEY: restored } = process.env;
          if (!/^phantom-ci-broker-cargo-v1-[a-f0-9]{64}-[a-f0-9]{64}$/.test(expected ?? '') ||
              primary !== expected || (restored && restored !== expected)) {
            throw new Error('native compilation cache identity differs');
          }
          NODE

      - name: Create disposable Tauri sidecar fixture
        shell: bash
        run: |
          HOST_TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          SIDECAR="desktop/src-tauri/binaries/ashlr-${HOST_TRIPLE}"
          if [[ -e "$SIDECAR" || -L "$SIDECAR" ]]; then
            echo "refusing unexpected sidecar fixture target: $SIDECAR" >&2
            exit 1
          fi
          trap 'rm -f -- "$SIDECAR"' ERR INT TERM
          (set -o noclobber; umask 077; : > "$SIDECAR")
          chmod 700 "$SIDECAR"
          echo "ASHLR_TEST_SIDECAR=$SIDECAR" >> "$GITHUB_ENV"
          echo "ASHLR_TEST_SIDECAR_CREATED=1" >> "$GITHUB_ENV"
          trap - ERR INT TERM
          # tauri.conf.json bundles resources/public (staged by
          # desktop/scripts/prepare-sidecar.mjs in real builds). The Tauri
          # build script refuses to run when that path is missing, so give
          # the library-only checks an empty, disposable placeholder.
          RESOURCES="desktop/src-tauri/resources/public"
          if [[ -e "desktop/src-tauri/resources" || -L "desktop/src-tauri/resources" ]]; then
            echo "refusing unexpected resources fixture target: desktop/src-tauri/resources" >&2
            exit 1
          fi
          mkdir -p -- "$RESOURCES"
          echo "ASHLR_TEST_RESOURCES_CREATED=1" >> "$GITHUB_ENV"

      - name: Check native broker formatting
        run: |
          set +e
          rustfmt --edition 2021 --check desktop/src-tauri/src/lib.rs desktop/src-tauri/src/native_launchd_broker.rs desktop/src-tauri/src/native_updates.rs desktop/src-tauri/src/native_update_client.rs > "$RUNNER_TEMP/rustfmt.out" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/rustfmt.out"
          if [ "$code" -ne 0 ]; then
            node .github/scripts/ci-failure-summary.mjs --title "Check native broker formatting" --file "$RUNNER_TEMP/rustfmt.out"
          fi
          exit "$code"

      - name: Check native broker library
        run: >-
          cargo check --manifest-path desktop/src-tauri/Cargo.toml
          --lib --locked

      - name: Lint native broker library
        run: |
          set +e
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --lib --locked -- -D warnings > "$RUNNER_TEMP/clippy.out" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/clippy.out"
          if [ "$code" -ne 0 ]; then
            node .github/scripts/ci-failure-summary.mjs --title "Lint native broker library" --file "$RUNNER_TEMP/clippy.out"
          fi
          exit "$code"

      - name: Test native broker library
        run: >-
          cargo test --manifest-path desktop/src-tauri/Cargo.toml
          --lib --locked -- --nocapture

      - name: Remove disposable Tauri sidecar fixture
        if: always()
        shell: bash
        run: |
          if [[ "${ASHLR_TEST_SIDECAR_CREATED:-}" == "1" ]]; then
            rm -f -- "$ASHLR_TEST_SIDECAR"
            test ! -e "$ASHLR_TEST_SIDECAR"
          fi
          if [[ "${ASHLR_TEST_RESOURCES_CREATED:-}" == "1" ]]; then
            rmdir -- desktop/src-tauri/resources/public desktop/src-tauri/resources
            test ! -e desktop/src-tauri/resources
          fi

      - name: Save native compilation cache
        if: success() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/master' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: desktop/src-tauri/target/debug/
          key: ${{ steps.cargo-inputs.outputs.key }}

  windows-service-authority:
    needs: classify
    if: needs.classify.outputs.lane == 'full' && github.event_name != 'push' && github.event_name != 'pull_request' && github.event_name != 'merge_group' && needs.classify.outputs.release_gate != 'true' && (github.event_name != 'schedule' || github.event.schedule == '17 */6 * * *')
    name: Windows service authority (Server 2022)
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      ASHLR_VITEST_TEST_TIMEOUT_MS: "30000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind candidate source
        env:
          ASHLR_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-source-binding.mjs

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build hardened inventory
        run: npm run build

      - name: Test npm runtime snapshot authority (hermetic)
        run: npm run test:ci -- test/npm-cli-launch.test.ts

      - name: Test native Windows service authority (hermetic)
        run: >-
          npm run test:ci --
          test/m93.windows-file-authority.test.ts
          test/m93.daemon-service-windows-integration.test.ts

  secret-scan:
    # Security floor 2026-10-26: diff-only secret scan on every event. No path
    # filter and no if-condition; Merge Gate fails unless this job succeeds.
    name: Secret scan (diff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 1
          sparse-checkout: .github
          sparse-checkout-cone-mode: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch the candidate range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
        run: node .github/scripts/ci-fetch-range.mjs
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version
      - name: Scan the commits this event adds
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$(git merge-base "$PR_BASE" "$HEAD_SHA")" || base="" ;;
            merge_group|push) base="$(node .github/scripts/ci-fetch-range.mjs scan-base)" || base="" ;;
            *)
              if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                git fetch --no-tags --filter=blob:none --unshallow origin
              fi
              if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                base=""
              else
                base="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
              fi
              ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "secret scan refused an incomplete commit range" >&2
            exit 1
          fi
          # A PR must not allowlist its own leak: ignore any repo-supplied config.
          rm -f .gitleaks.toml .gitleaksignore
          echo "scanning ${base}..${HEAD_SHA}"
          set +e
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --log-opts="${base}..${HEAD_SHA}" --redact --no-banner --max-target-megabytes 5 --timeout 120 > "${RUNNER_TEMP}/secret-scan.out" 2>&1
          code=$?
          set -e
          cat "${RUNNER_TEMP}/secret-scan.out"
          if [ "$code" -ne 0 ]; then
            node .github/scripts/ci-failure-summary.mjs --title "Secret scan (diff)" --file "${RUNNER_TEMP}/secret-scan.out"
          fi
          exit "$code"

  merge-gate:
    # One stable required check. PR and merge_group: Secret-shape scan, Secret
    # scan, Classify, Check generated files (clean-tree) and Fast gate must
    # pass, Quick typecheck is advisory, and every full lane must be skipped.
    # Master push: the same, except Fast gate is skipped (it is per-PR only).
    # Daily, dispatch and workflow_call runs: Secret-shape scan plus the
    # selected full lanes. Exact dependency keys; anything skipped, cancelled or
    # missing that should have run is a failure.
    name: Merge Gate
    # macOS lanes are not needed: they never run on PR or merge_group (waiver).
    needs: [secret-shape, secret-scan, classify, clean-tree, quick, fast-gate, site, docs, ci, windows-service-authority, release-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected CI lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SCHEDULE: ${{ github.event.schedule }}
          GATE_NEEDS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.GATE_NEEDS || 'null');
          const full = ['ci', 'windows-service-authority'];
          const expected = ['secret-shape', 'secret-scan', 'classify', 'clean-tree', 'quick', 'fast-gate', 'site', 'docs', ...full, 'release-build'];
          if (!jobs || typeof jobs !== 'object' || Array.isArray(jobs) ||
              expected.some((name) => !Object.hasOwn(jobs, name)) || Object.keys(jobs).length !== expected.length) {
            throw new Error('CI dependency inventory is incomplete');
          }
          const outcome = (name) => jobs[name]?.result;
          if (outcome('secret-shape') !== 'success') throw new Error(`Secret-shape scan concluded ${outcome('secret-shape') ?? 'missing'}`);
          // Security floor: a skipped, cancelled or failed secret scan fails the gate.
          if (outcome('secret-scan') !== 'success') throw new Error(`Secret scan (diff) concluded ${outcome('secret-scan') ?? 'missing'}`);
          // Daily install smokes use their own cron. Full lanes stay on the
          // six-hour schedule and are skipped here; the OS gates own that run.
          if (process.env.SCHEDULE === '17 11 * * *') {
            console.log('Merge Gate passed: daily install smoke schedule');
            process.exit(0);
          }
          if (outcome('classify') !== 'success') throw new Error('CI classification did not pass');
          const lane = jobs.classify.outputs?.lane;
          if (lane !== 'site' && lane !== 'docs' && lane !== 'full') throw new Error('CI lane is missing or unknown');
          // Direct master pushes take the same seconds-fast gate as PRs; a push
          // event carrying a TAG ref is the reusable M33 verify call and keeps
          // its full-lane requirement.
          const masterPush = process.env.EVENT_NAME === 'push' && process.env.REF === 'refs/heads/master';
          const fast = process.env.EVENT_NAME === 'pull_request' || process.env.EVENT_NAME === 'merge_group' || masterPush;
          const release = jobs.classify.outputs?.release_gate === 'true';
          const masterRef = process.env.REF === 'refs/heads/master';
          const taggedRef = /^refs\/tags\/v\d+\.\d+\.\d+$/.test(process.env.REF ?? '');
          // A tag dispatch builds that exact commit. The half-hour schedule stays
          // on master. A reusable tag push is not a release build.
          if (release && !(
            (process.env.EVENT_NAME === 'schedule' && masterRef) ||
            (process.env.EVENT_NAME === 'workflow_dispatch' && (masterRef || taggedRef))
          )) throw new Error('Invalid release event');
          const lanes = ['site', 'docs', ...full, 'release-build'];
          const selected = lane === 'full' ? full : [lane];
          // PR and merge queue: the independent quick check runs for every lane.
          // Mason directive 2026-11-13: quick typecheck is advisory on fast events —
          // it still runs and reports, but a failure (e.g. CODEOWNERS drift on a
          // stale branch) does not block the merge. The daily full lane and
          // main-guardian remain the correctness floor. Secret-shape, secret-scan
          // and classify stay hard requirements.
          // RQ-PH-GATE-SPLIT-1: clean-tree (Check generated files) is a hard
          // requirement on every fast event. It is designed not to run on
          // schedule, dispatch and tag-push (reusable) events, where it must be
          // skipped; if it did run there, only success is accepted.
          // authority-drift (Check authority drift (hermetic)) is advisory and
          // deliberately off Merge Gate needs; Auto-tag and the release gate
          // read it from the exact sha instead.
          // RQ-CI-FASTGATE-2: fast-gate (typecheck plus affected tests) is a
          // hard requirement on pull_request and merge_group only. Master
          // pushes and every other event skip it. It does not replace
          // clean-tree, secret-shape or secret-scan.
          const fastGate = process.env.EVENT_NAME === 'pull_request' || process.env.EVENT_NAME === 'merge_group';
          const chosen = release ? ['release-build'] : fastGate ? ['clean-tree', 'fast-gate'] : fast ? ['clean-tree'] : selected;
          const advisory = fast && !release ? ['quick'] : [];
          const excluded = ['quick', 'clean-tree', 'fast-gate', ...lanes].filter((name) => !chosen.includes(name) && !advisory.includes(name));
          // A reusable workflow_call runs under the caller's push event: the Windows
          // service lane is deferred there, so it must be skipped, never failed.
          const deferred = process.env.EVENT_NAME === 'push' ? ['windows-service-authority'] : [];
          for (const name of chosen) {
            if (deferred.includes(name) && outcome(name) === 'skipped') { console.log(`${name} deferred to the daily run`); continue; }
            if (outcome(name) !== 'success') throw new Error(`${lane} CI required job ${name} concluded ${outcome(name) ?? 'missing'}`);
          }
          for (const name of advisory) {
            if (outcome(name) !== 'skipped' && outcome(name) !== 'success') console.log(`ADVISORY ${name} concluded ${outcome(name) ?? 'missing'} — not blocking (fast lane)`);
          }
          for (const name of excluded) {
            if (name === 'clean-tree' && outcome(name) === 'success') continue;
            if (outcome(name) !== 'skipped') throw new Error(`${lane} CI excluded job ${name} concluded ${outcome(name) ?? 'missing'}`);
          }
          console.log(`Merge Gate passed: ${fast ? 'fast' : 'full'} ${lane} CI`);
          NODE

  master-full:
    # Independent of Merge Gate's fast branch. Only the six-hour master run
    # produces this receipt; half-hour release preparation is never evidence.
    name: Master full qualification
    needs: [secret-shape, secret-scan, classify, quick, clean-tree, authority-drift, fast-gate, site, docs, ci, ci-shared-macos, mac-general, mac-isolated, native-macos-broker-foundation, windows-service-authority, merge-gate, release-build]
    if: ${{ always() && github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact full revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record full result and first failing range
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_NEEDS: ${{ toJSON(needs) }}
          FULL_SCHEDULE: ${{ github.event.schedule }}
        run: |
          node --test .github/tests/ci-master-full.test.mjs
          node .github/scripts/ci-master-full.mjs record
      - name: Upload master full receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: master-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: master-full.json
          if-no-files-found: error
          retention-days: 30

  fixup-queue:
    # Daily red run -> READY FIXUP lines for the router queue (fix-forward owner:
    # ci-efficiency). One line per failed job from the needs context only: no
    # logs, env or API reads, default read-only token, output passed through the
    # pinned scrub.pl. Retention 7 days.
    name: Daily fixup queue
    needs: [secret-shape, secret-scan, classify, site, docs, ci, ci-shared-macos, mac-general, mac-isolated, native-macos-broker-foundation, windows-service-authority, merge-gate, release-build]
    if: ${{ always() && ((github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout scrubber
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/tests/secret-shape/scrub.pl
          sparse-checkout-cone-mode: false
      - name: Build fixup-queue.txt
        env:
          NEEDS: ${{ toJSON(needs) }}
          SCRUB_SHA256: 5aa902abedbb3bf7fa8d893b93969e247c82ff62ac26cd082215caabfb740265
          MAC_SLICE: ${{ needs.classify.outputs.mac_slice }}
        run: |
          set -euo pipefail
          echo "${SCRUB_SHA256}  .github/tests/secret-shape/scrub.pl" | sha256sum --check --strict
          node <<'NODE' > raw.txt
          const needs = JSON.parse(process.env.NEEDS);
          const sha7 = process.env.GITHUB_SHA.slice(0, 7);
          const run = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const slice = /^[0-6]$/.test(process.env.MAC_SLICE ?? '') ? process.env.MAC_SLICE : 'all';
          let n = 0;
          for (const [job, { result }] of Object.entries(needs)) {
            if (result !== 'failure' && result !== 'cancelled') continue;
            n += 1;
            const mac = job.startsWith('mac-') ? `, mac_shard=${slice}` : '';
            console.log(`- READY RQ-FIXUP-PHANTOM-${sha7}-${n} (P0, pool=any, tier=work, repo=phantom, lead=CI-Efficiency, owner=ci-efficiency, job=${job}, result=${result}${mac}, run=${run}, sha=${sha7}): daily full suite job ${job} concluded ${result}; first error is in the run's failed step.`);
          }
          NODE
          node -e 'const s=process.env.MAC_SLICE;console.log(JSON.stringify({schemaVersion:1,repo:"phantom",run_id:process.env.GITHUB_RUN_ID,sha:process.env.GITHUB_SHA.slice(0,7),event:process.env.GITHUB_EVENT_NAME,mac_shard:/^[0-6]$/.test(s??"")?Number(s):"all",mac_shards:7}))' | perl .github/tests/secret-shape/scrub.pl > mac-shard.json
          echo "Mac shard: $(cat mac-shard.json)" >> "$GITHUB_STEP_SUMMARY"
          perl .github/tests/secret-shape/scrub.pl < raw.txt > fixup-queue.txt
          echo "fixup_lines=$(wc -l < fixup-queue.txt)"
          cat fixup-queue.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fixup queue
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantom-fixup-queue
          path: |
            fixup-queue.txt
            mac-shard.json
          if-no-files-found: error
          retention-days: 7

  release-build:
    needs: [secret-shape, classify]
    name: Desktop release smoke
    if: needs.classify.outputs.release_gate == 'true'
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.eligible.outputs.ready }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Require master or a stable release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node <<'NODE'
          const ref = process.env.RELEASE_REF ?? '';
          const releaseTag = /^refs\/tags\/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          if (ref !== 'refs/heads/master' && !releaseTag.test(ref)) {
            console.error('release ref refused');
            process.exit(1);
          }
          NODE
      - name: Checkout exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reuse successful push CI and existing prepared artifact
        id: eligible
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-fast-smoke.mjs push
      - name: Find existing immutable build
        if: steps.eligible.outputs.ready == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-fast-smoke.mjs build
      - name: Set up Node
        if: steps.eligible.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          cache: npm
      # Build, pack and smoke run only in a fresh detached worktree of the one
      # pinned commit, never in this job checkout. The fixed path under the
      # ephemeral runner temp keeps the native cache location stable; creation
      # refuses an existing non-empty path and proves the new tree pristine.
      - name: Create isolated release tree
        if: steps.eligible.outputs.ready == 'true'
        id: tree
        run: node scripts/release-isolated-tree.mjs create "$RUNNER_TEMP/phantom-release-tree"
      - name: Download existing immutable build
        if: steps.existing.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.existing.outputs.artifact }}
          path: ${{ runner.temp }}/release-prepared
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.existing.outputs.run }}
          digest-mismatch: error
      # Independent setup overlaps: the pinned npm/Tauri CLI install runs in the
      # background while Bun, Rust and the native cache restore. Its exit code is
      # collected before the build; build-desktop-nightly.mjs re-probes every pin.
      - name: Start pinned build tool install
        if: steps.eligible.outputs.ready == 'true' && steps.existing.outputs.ready != 'true'
        run: |
          ( set +e; npm install --global npm@10.9.8 @tauri-apps/cli@2.11.4 > "$RUNNER_TEMP/build-tools.log" 2>&1
            echo "$?" > "$RUNNER_TEMP/build-tools.status" ) &
      - name: Set up Bun
        if: steps.eligible.outputs.ready == 'true' && steps.existing.outputs.ready != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Set up Rust
        if: steps.eligible.outputs.ready == 'true' && steps.existing.outputs.ready != 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.97.1'
      # Lockfile-keyed, never commit-keyed: an exact hit restores and skips the
      # post-job save, so runs stop re-uploading and evicting each other's
      # entries. A Cargo.lock change falls back to the toolchain prefix.
      # Node modules are restored by setup-node (cache: npm). Cargo and
      # Electron downloads are cached. The Rust toolchain is not: a restored
      # toolchain can replace the 1.97.1 pin, so rust-toolchain installs it
      # on every run and this cache does not keep it.
      - name: Cache native compiler inputs
        if: steps.eligible.outputs.ready == 'true' && steps.existing.outputs.ready != 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/db/
            ~/.cache/electron/
            ~/.cache/electron-builder/
            ~/Library/Caches/electron/
            ~/Library/Caches/electron-builder/
            ${{ steps.tree.outputs.root }}/desktop/src-tauri/target/
          key: release-native-v4-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: release-native-v4-${{ runner.os }}-${{ runner.arch }}-1.97.1-
      - name: Install pinned build tools
        if: steps.eligible.outputs.ready == 'true' && steps.existing.outputs.ready != 'true'
        timeout-minutes: 5
        run: |
          until [ -s "$RUNNER_TEMP/build-tools.status" ]; do sleep 1; done
          status="$(cat "$RUNNER_TEMP/build-tools.status")"
          if [ "$status" != 0 ]; then cat "$RUNNER_TEMP/build-tools.log"; exit 1; fi
      - name: Build unsigned desktop and original package once
        if: steps.eligible.outputs.ready == 'true' && steps.existing.outputs.ready != 'true'
        id: build
        timeout-minutes: 45
        working-directory: ${{ steps.tree.outputs.root }}
        env:
          PHANTOM_RELEASE_REVISION: ${{ github.sha }}
        run: |
          npm run build:desktop:nightly -- --existing-icons
          node scripts/release-isolated-tree.mjs verify .
          node .github/scripts/release-fast-smoke.mjs prepare
          node scripts/release-isolated-tree.mjs verify .
      - name: Capture original immutable input custody
        if: steps.eligible.outputs.ready == 'true'
        working-directory: ${{ steps.tree.outputs.root }}
        run: node .github/scripts/release-local-input.mjs capture
      - name: Upload immutable release input
        id: artifact
        if: steps.build.outputs.directory != '' || steps.existing.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phantom-release-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-prepared
          if-no-files-found: error
          compression-level: 0
          retention-days: 7


      # The combined build retains its existing 90m job ceiling. Only this
      # smoke phase has the separate hard 5m deadline (plus bounded cleanup).
      - name: Start bounded release smoke phase
        if: steps.eligible.outputs.ready == 'true'
        run: node .github/scripts/release-smoke-phase.mjs start
      - name: Verify green master push CI
        if: steps.eligible.outputs.ready == 'true'
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-smoke-phase.mjs push
      - name: Smoke desktop release artifact
        if: steps.eligible.outputs.ready == 'true'
        id: smoke
        # Phase deadline is 5m plus a 5s kill grace; fail fast past that.
        timeout-minutes: 6
        working-directory: ${{ steps.tree.outputs.root }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_CI_RUN: ${{ steps.push.outputs.run }}
          PUSH_CI_ATTEMPT: ${{ steps.push.outputs.attempt }}
          PREPARED_DIRECTORY: ${{ runner.temp }}/release-prepared
          INPUT_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          INPUT_ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          FRESH_RELEASE_BUILD: ${{ steps.build.conclusion == 'success' && 'true' || 'false' }}
        run: node .github/scripts/release-smoke-phase.mjs smoke
      - name: Upload qualified build handoff
        if: steps.smoke.outputs.bundle != ''
        env:
          NODE_OPTIONS: --import=${{ github.workspace }}/.github/scripts/release-smoke-upload-deadline.mjs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ashlr-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.smoke.outputs.bundle }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Finish bounded release smoke phase
        if: steps.eligible.outputs.ready == 'true'
        run: node .github/scripts/release-smoke-phase.mjs finish

  release-suites:
    # RELEASE-GATE-SPLIT-1: release-relevant suites on the exact release-prep
    # SHA. Runs only beside a Desktop release smoke that actually smoked
    # (ready == 'true'); otherwise it is skipped and Auto-tag holds. Not in
    # Merge Gate needs, so merge-queue required checks are unchanged. Hermetic:
    # no secrets, no signing identity, no notarization; the signing-path tests
    # exercise fail-closed verification code only. Auto-tag reads this check
    # by name when RELEASE_GATE_MODE == 'split'. The suite list lives in
    # .github/scripts/ci-release-suites.mjs.
    name: Release suites (build + signing path)
    needs: [secret-shape, classify, release-build]
    if: needs.classify.outputs.release_gate == 'true' && needs.release-build.outputs.ready == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build, release contracts, signing path, release scripts
        run: node .github/scripts/ci-release-suites.mjs

  release-gate-autotag:
    name: Dispatch Auto-tag for green release-gate SHA
    needs: [release-build, release-suites]
    if: github.event_name == 'workflow_dispatch' && inputs.release_gate == true && github.ref == 'refs/heads/master' && needs['release-build'].result == 'success' && needs['release-suites'].result == 'success'
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch Auto-tag for exact release-gate SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/auto-tag.yml/dispatches" --input - <<EOF
          {"ref":"master","inputs":{"sha":"${GITHUB_SHA}"}}
          EOF
