  ci-shared-macos:
    # Queues with the isolated lane instead of after it. PRs no longer run the
    # general Mac matrix, so waiting on mac-isolated only added a second Mac
    # queue wait to every PR.
    needs: classify
    if: needs.classify.outputs.lane == 'full' && needs.classify.outputs.full_os == 'true' && !github.event.pull_request.draft && github.event_name != 'push'
    name: CI (Node 22, ${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos, shared queue authority
            native_launchd: "1"
            test_args: >-
              test/m111.work-queue.test.ts test/m392.queue-lease-epochs.test.ts
              test/m395.effect-terminal-retention.test.ts
              test/m367.daemon-observer-scheduler.test.ts
              test/m93.daemon-service.test.ts
              test/m93.daemon-service-launchd-integration.test.ts
              test/m455.external-skill-maturity.test.ts
              test/m456.skill-retrieval-calibration.test.ts
              test/m457.external-skill-artifact-firewall.test.ts
              test/m460.policy-assignment-receipts.test.ts
              test/m463.claimed-batch-admission.test.ts
              test/m464.agent-work-transitions.test.ts
              test/m466.host-merge-revocation-protocol.test.ts
              test/m467.detached-post-merge-verification.test.ts
    runs-on: ${{ matrix.os }}
    # Master runs each Mac lane one push at a time: a newer push replaces the
    # one still waiting, so a burst of merges cannot stack hours of Mac work
    # ahead of every PR. Merge Gate accepts that replacement only once master
    # has moved past this commit. PR runs get a group of their own.
    concurrency:
      group: ${{ github.event_name == 'push' && 'ci-master-mac-shared' || format('ci-mac-{0}-shared', github.run_id) }}
      cancel-in-progress: false
    env: *node_ci_environment
    steps: *node_ci_steps

  mac-general:
    needs: classify
    # Cost: this 4-shard macos-15 lane was ~95% of CI billing (macOS bills
    # ~10x Linux; median 15 min/shard, tail 155 min) and the main Mac queue
    # bottleneck for agents. The same suites run on Linux/Windows in `ci` and
    # the macOS-specific authority suites still run per PR (mac-isolated,
    # ci-shared-macos, native-macos-broker-foundation). The exhaustive Mac
    # partition runs on every master push, reusable workflow_call runs and any PR
    # labelled `ci:full-mac`. Merge-queue commits defer it like PRs: the master
    # push that follows the queue still runs it.
    if: needs.classify.outputs.lane == 'full' && (github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.event_name != 'push' || contains(github.event.pull_request.labels.*.name, 'ci:full-mac'))
    name: Mac exhaustive (${{ matrix.shard }}/4)
    runs-on: macos-15
    timeout-minutes: 90
    # Master runs each Mac lane one push at a time: a newer push replaces the
    # one still waiting, so a burst of merges cannot stack hours of Mac work
    # ahead of every PR. Merge Gate accepts that replacement only once master
    # has moved past this commit. PR runs get a group of their own.
    concurrency:
      group: ${{ github.event_name == 'push' && format('ci-master-mac-general-{0}', matrix.shard) || format('ci-mac-{0}-general-{1}', github.run_id, matrix.shard) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    env:
      ASHLR_VITEST_TEST_TIMEOUT_MS: '5000'
      ASHLR_RUN_NATIVE_LAUNCHD_TEST: '1'
      ASHLR_TEST_CI_TIMEOUT_MS: '5400000'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind candidate source
        env:
          ASHLR_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-source-binding.mjs
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test complete Mac general partition
        id: lane
        run: node .github/scripts/ci-qualification-lane.mjs mac-general-${{ matrix.shard }}
      - name: Observe advisory Mac impact shadow
        id: shadow
        continue-on-error: true
        timeout-minutes: 2
        env:
          ASHLR_SHADOW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node .github/scripts/ci-impact-shadow.mjs mac-general-${{ matrix.shard }} "${{ steps.lane.outputs.lane_dir }}"
      - name: Upload advisory Mac impact shadow
        if: success() && steps.shadow.outputs.shadow_dir != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantom-impact-shadow-mac-general-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.shadow.outputs.shadow_dir }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload Mac qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ashlr-qualification-mac-general-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.lane.outputs.lane_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Clean disposable native launchd fixture
        if: always()
        run: node scripts/cleanup-launchd-test.mjs

  mac-isolated:
    needs: classify
    if: needs.classify.outputs.lane == 'full' && needs.classify.outputs.full_os == 'true' && !github.event.pull_request.draft && github.event_name != 'push'
    name: Mac exhaustive (isolated)
    runs-on: macos-15
    timeout-minutes: 90
    # Master runs each Mac lane one push at a time: a newer push replaces the
    # one still waiting, so a burst of merges cannot stack hours of Mac work
    # ahead of every PR. Merge Gate accepts that replacement only once master
    # has moved past this commit. PR runs get a group of their own.
    concurrency:
      group: ${{ github.event_name == 'push' && 'ci-master-mac-isolated' || format('ci-mac-{0}-isolated', github.run_id) }}
      cancel-in-progress: false
    env:
      ASHLR_VITEST_TEST_TIMEOUT_MS: '5000'
      ASHLR_RUN_NATIVE_LAUNCHD_TEST: '1'
      ASHLR_TEST_CI_TIMEOUT_MS: '5400000'
      # The isolated suites mostly wait on real child processes. Two run at a
      # time, longest first, each in its own home with one worker.
      ASHLR_TEST_CI_ISOLATED_CONCURRENCY: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind candidate source
        env:
          ASHLR_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-source-binding.mjs
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test complete Mac isolated suites
        id: lane
        run: node .github/scripts/ci-qualification-lane.mjs mac-isolated
      - name: Observe advisory Mac impact shadow
        id: shadow
        continue-on-error: true
        timeout-minutes: 2
        env:
          ASHLR_SHADOW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: node .github/scripts/ci-impact-shadow.mjs mac-isolated "${{ steps.lane.outputs.lane_dir }}"
      - name: Upload advisory Mac impact shadow
        if: success() && steps.shadow.outputs.shadow_dir != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phantom-impact-shadow-mac-isolated-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.shadow.outputs.shadow_dir }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload Mac qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ashlr-qualification-mac-isolated-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.lane.outputs.lane_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Clean disposable native launchd fixture
        if: always()
        run: node scripts/cleanup-launchd-test.mjs

  native-macos-broker-foundation:
    name: Native macOS broker foundation (Rust 1.97.1)
    # Own checkout and fixtures remain independent evidence. Queues with the
    # isolated lane rather than after it, so a PR waits on one Mac queue, not two.
    needs: classify
    if: needs.classify.outputs.lane == 'full' && !github.event.pull_request.draft && github.event_name != 'push'
    runs-on: macos-latest
    # Master runs each Mac lane one push at a time: a newer push replaces the
    # one still waiting, so a burst of merges cannot stack hours of Mac work
    # ahead of every PR. Merge Gate accepts that replacement only once master
    # has moved past this commit. PR runs get a group of their own.
    concurrency:
      group: ${{ github.event_name == 'push' && 'ci-master-mac-broker' || format('ci-mac-{0}-broker', github.run_id) }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind candidate source
        env:
          ASHLR_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-source-binding.mjs

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      # Compiled cache contents are executable. Only successful protected-master
      # pushes populate this private CI namespace; PRs restore but never save.
      - name: Fingerprint native compile inputs
        id: cargo-inputs
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const { appendFileSync, lstatSync, readFileSync } = require('node:fs');
          const digest = (value) => createHash('sha256').update(value).digest('hex');
          const command = (file, args) => {
            const value = execFileSync(file, args, { encoding: 'utf8', maxBuffer: 1024 * 1024 }).trim();
            if (!value) throw new Error('missing native compiler probe');
            return value;
          };
          const nativeInput = (file) => [
            '.github/workflows/ci.yml', 'Cargo.toml', 'Cargo.lock',
            '.cargo/config', '.cargo/config.toml', 'rust-toolchain', 'rust-toolchain.toml',
            'desktop/src-tauri/Cargo.toml', 'desktop/src-tauri/Cargo.lock',
            'desktop/src-tauri/build.rs', 'desktop/src-tauri/tauri.conf.json',
            'desktop/src-tauri/Info.plist', 'desktop/src-tauri/Entitlements.plist',
            'desktop/src-tauri/.cargo/config', 'desktop/src-tauri/.cargo/config.toml',
            'desktop/src-tauri/rust-toolchain', 'desktop/src-tauri/rust-toolchain.toml',
          ].includes(file) ||
            file.startsWith('desktop/src-tauri/src/') ||
            file.startsWith('desktop/src-tauri/capabilities/') ||
            file.startsWith('desktop/src-tauri/icons/');
          // git's index supplies membership: outputs and untracked private files
          // cannot enter the fingerprint or be read by this step.
          const files = command('git', ['ls-files', '-z']).split('\0').filter(nativeInput).sort();
          for (const required of ['.github/workflows/ci.yml', 'desktop/src-tauri/Cargo.toml',
            'desktop/src-tauri/Cargo.lock', 'desktop/src-tauri/build.rs', 'desktop/src-tauri/tauri.conf.json']) {
            if (!files.includes(required)) throw new Error('missing tracked native input');
          }
          const source = createHash('sha256');
          for (const file of files) {
            if (!lstatSync(file).isFile()) throw new Error('nonregular native input');
            source.update(JSON.stringify([file, digest(readFileSync(file))]));
          }
          // Output-directory/wrapper overrides would change the cached artifact
          // domain. They are not used by this gate and must not share its key.
          for (const field of ['CARGO_TARGET_DIR', 'CARGO_BUILD_BUILD_DIR', 'RUSTC_WRAPPER', 'RUSTC_WORKSPACE_WRAPPER']) {
            if (process.env[field]) throw new Error('unsupported native cache output or wrapper');
          }
          const rust = command('rustc', ['-vV']);
          const host = rust.match(/^host: (.+)$/m)?.[1];
          if (!host || !process.env.ImageOS || !process.env.ImageVersion) throw new Error('missing native compiler/image identity');
          const flags = ['RUSTFLAGS', 'CARGO_ENCODED_RUSTFLAGS', 'CARGO_BUILD_RUSTFLAGS',
            'CARGO_BUILD_TARGET', 'CC', 'CFLAGS', 'CXX', 'CXXFLAGS', 'CPPFLAGS', 'LDFLAGS',
            'SDKROOT', 'MACOSX_DEPLOYMENT_TARGET'].map((field) => [field, process.env[field] ?? '']);
          flags.push(...Object.entries(process.env).filter(([field]) =>
            /^CARGO_PROFILE_(DEV|TEST)_/.test(field) || /^CARGO_TARGET_[A-Z0-9_]+_(LINKER|RUSTFLAGS)$/.test(field)).sort());
          const environment = digest(JSON.stringify({
            rust, cargo: command('cargo', ['-V']), host,
            os: command('sw_vers', ['-productVersion']), arch: command('uname', ['-m']),
            image: [process.env.ImageOS, process.env.ImageVersion],
            xcode: command('xcodebuild', ['-version']),
            developer: command('xcode-select', ['-p']),
            sdk: [command('xcrun', ['--show-sdk-version']), command('xcrun', ['--show-sdk-path'])],
            flags, invocation: 'host-lib-locked-default-features-dev-test',
          }));
          const key = `phantom-ci-broker-cargo-v1-${environment}-${source.digest('hex')}`;
          appendFileSync(process.env.GITHUB_OUTPUT, `key=${key}\n`);
          NODE

      - name: Restore native compilation cache
        id: cargo-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: desktop/src-tauri/target/debug/
          key: ${{ steps.cargo-inputs.outputs.key }}

      # GitHub may return a primary-key prefix match. It is not this exact
      # compilation domain; refuse before invoking any cached executable.
      - name: Validate native cache identity
        env:
          EXPECTED_CARGO_CACHE_KEY: ${{ steps.cargo-inputs.outputs.key }}
          PRIMARY_CARGO_CACHE_KEY: ${{ steps.cargo-cache.outputs.cache-primary-key }}
          RESTORED_CARGO_CACHE_KEY: ${{ steps.cargo-cache.outputs.cache-matched-key }}
        run: |
          node <<'NODE'
          const { EXPECTED_CARGO_CACHE_KEY: expected, PRIMARY_CARGO_CACHE_KEY: primary,
            RESTORED_CARGO_CACHE_KEY: restored } = process.env;
          if (!/^phantom-ci-broker-cargo-v1-[a-f0-9]{64}-[a-f0-9]{64}$/.test(expected ?? '') ||
              primary !== expected || (restored && restored !== expected)) {
            throw new Error('native compilation cache identity differs');
          }
          NODE

      - name: Create disposable Tauri sidecar fixture
        shell: bash
        run: |
          HOST_TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          SIDECAR="desktop/src-tauri/binaries/ashlr-${HOST_TRIPLE}"
          if [[ -e "$SIDECAR" || -L "$SIDECAR" ]]; then
            echo "refusing unexpected sidecar fixture target: $SIDECAR" >&2
            exit 1
          fi
          trap 'rm -f -- "$SIDECAR"' ERR INT TERM
          (set -o noclobber; umask 077; : > "$SIDECAR")
          chmod 700 "$SIDECAR"
          echo "ASHLR_TEST_SIDECAR=$SIDECAR" >> "$GITHUB_ENV"
          echo "ASHLR_TEST_SIDECAR_CREATED=1" >> "$GITHUB_ENV"
          trap - ERR INT TERM
          # tauri.conf.json bundles resources/public (staged by
          # desktop/scripts/prepare-sidecar.mjs in real builds). The Tauri
          # build script refuses to run when that path is missing, so give
          # the library-only checks an empty, disposable placeholder.
          RESOURCES="desktop/src-tauri/resources/public"
          if [[ -e "desktop/src-tauri/resources" || -L "desktop/src-tauri/resources" ]]; then
            echo "refusing unexpected resources fixture target: desktop/src-tauri/resources" >&2
            exit 1
          fi
          mkdir -p -- "$RESOURCES"
          echo "ASHLR_TEST_RESOURCES_CREATED=1" >> "$GITHUB_ENV"

      - name: Check native broker formatting
        run: >-
          rustfmt --edition 2021 --check
          desktop/src-tauri/src/lib.rs
          desktop/src-tauri/src/native_launchd_broker.rs
          desktop/src-tauri/src/native_updates.rs
          desktop/src-tauri/src/native_update_client.rs

      - name: Check native broker library
        run: >-
          cargo check --manifest-path desktop/src-tauri/Cargo.toml
          --lib --locked

      - name: Lint native broker library
        run: >-
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml
          --lib --locked -- -D warnings

      - name: Test native broker library
        run: >-
          cargo test --manifest-path desktop/src-tauri/Cargo.toml
          --lib --locked -- --nocapture

      - name: Remove disposable Tauri sidecar fixture
        if: always()
        shell: bash
        run: |
          if [[ "${ASHLR_TEST_SIDECAR_CREATED:-}" == "1" ]]; then
            rm -f -- "$ASHLR_TEST_SIDECAR"
            test ! -e "$ASHLR_TEST_SIDECAR"
          fi
          if [[ "${ASHLR_TEST_RESOURCES_CREATED:-}" == "1" ]]; then
            rmdir -- desktop/src-tauri/resources/public desktop/src-tauri/resources
            test ! -e desktop/src-tauri/resources
          fi

      - name: Save native compilation cache
        if: success() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/master' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: desktop/src-tauri/target/debug/
          key: ${{ steps.cargo-inputs.outputs.key }}

  windows-service-authority:
    needs: classify
    if: needs.classify.outputs.lane == 'full' && github.event_name != 'push'
    name: Windows service authority (Server 2022)
    runs-on: windows-2022
    env:
      ASHLR_VITEST_TEST_TIMEOUT_MS: "30000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Bind candidate source
        env:
          ASHLR_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/ci-source-binding.mjs

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build hardened inventory
        run: npm run build

      - name: Test npm runtime snapshot authority (hermetic)
        run: npm run test:ci -- test/npm-cli-launch.test.ts

      - name: Test native Windows service authority (hermetic)
        run: >-
          npm run test:ci --
          test/m93.windows-file-authority.test.ts
          test/m93.daemon-service-windows-integration.test.ts

  merge-gate:
    # One stable required check across both PR lanes. The classifier and every
    # matrix job must settle before this job can report a result. A skipped or
    # failed selected lane is a failure, including when classification failed.
    name: Merge Gate
    needs: [classify, site, docs, ci, ci-windows, ci-shared-macos, mac-general, mac-isolated, native-macos-broker-foundation, windows-service-authority]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected CI lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          OS_LEGS_DEFERRED: ${{ github.event_name == 'pull_request' && needs.classify.outputs.full_os != 'true' }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          EVENT_DRAFT: ${{ github.event.pull_request.draft }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_NEEDS: ${{ toJSON(needs) }}
          MAC_GENERAL_DEFERRED: ${{ (github.event_name == 'merge_group' || github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:full-mac')) }}
        run: |
          # A master Mac lane cancelled by its concurrency group counts as
          # superseded only when master has really moved past this commit.
          MAC_SUPERSEDED=false
          if [ "$EVENT_NAME" = push ]; then
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            head=$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote "https://github.com/$REPOSITORY" refs/heads/master | cut -f1) || head=''
            if [ -n "$head" ] && [ "$head" != "$COMMIT_SHA" ]; then MAC_SUPERSEDED=true; fi
          fi
          export MAC_SUPERSEDED
          # A draft PR skips its Mac lanes until ready_for_review. Defer them only
          # while the PR is a draft right now, so a re-run of a draft-era run after
          # it was marked ready cannot pass without them. A failed read fails closed.
          MAC_DRAFT_DEFERRED=false
          if [ "$EVENT_NAME" = pull_request ] && [ "$EVENT_DRAFT" = true ]; then
            MAC_DRAFT_DEFERRED=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .draft) || MAC_DRAFT_DEFERRED=false
          fi
          export MAC_DRAFT_DEFERRED
          node <<'NODE'
          const jobs = JSON.parse(process.env.GATE_NEEDS || 'null');
          const full = ['ci', 'ci-windows', 'ci-shared-macos', 'mac-general', 'mac-isolated', 'native-macos-broker-foundation', 'windows-service-authority'];
          const expected = ['classify', 'site', 'docs', ...full];
          if (!jobs || typeof jobs !== 'object' || Array.isArray(jobs) ||
              expected.some((name) => !Object.hasOwn(jobs, name)) || Object.keys(jobs).length !== expected.length) {
            throw new Error('CI dependency inventory is incomplete');
          }
          const outcome = (name) => jobs[name]?.result;
          if (outcome('classify') !== 'success') throw new Error('CI classification did not pass');
          const lane = jobs.classify.outputs?.lane;
          if (lane !== 'site' && lane !== 'docs' && lane !== 'full') throw new Error('CI lane is missing or unknown');
          const selected = lane === 'full' ? full : [lane];
          const excluded = ['site', 'docs', ...full].filter((name) => !selected.includes(name));
          // mac-general is deferred to post-merge on unlabelled PRs (see job).
          // A push to master defers the macOS and Windows service lanes to the
          // nightly scheduled run; they must be skipped, never failed.
          const deferred = process.env.EVENT_NAME === 'push'
            ? ['ci-shared-macos', 'mac-general', 'mac-isolated', 'native-macos-broker-foundation', 'windows-service-authority']
            : process.env.MAC_DRAFT_DEFERRED === 'true'
            ? ['ci-shared-macos', 'mac-general', 'mac-isolated', 'native-macos-broker-foundation']
            : process.env.MAC_GENERAL_DEFERRED === 'true' ? ['mac-general'] : [];
          // A PR with no platform-sensitive change and no `ci:full-os` label
          // skips the Windows portability and macOS isolated/shared legs. Only
          // `skipped` is accepted; failure or cancelled still fails the gate.
          if (process.env.OS_LEGS_DEFERRED === 'true') deferred.push('ci-windows', 'ci-shared-macos', 'mac-isolated');
          // A later master push's run replaced this Mac lane while it waited and
          // covers this commit's code; the cancelled check still marks this
          // commit's own Mac evidence incomplete.
          const superseded = process.env.MAC_SUPERSEDED === 'true'
            ? ['ci-shared-macos', 'mac-general', 'mac-isolated', 'native-macos-broker-foundation'] : [];
          for (const name of selected) {
            if (deferred.includes(name) && outcome(name) === 'skipped') { console.log(`${name} deferred ${process.env.EVENT_NAME === 'push' ? 'to the nightly run' : process.env.MAC_DRAFT_DEFERRED === 'true' ? 'while the PR is a draft' : 'to post-merge'}`); continue; }
            if (superseded.includes(name) && outcome(name) === 'cancelled') { console.log(`${name} superseded by a later master push`); continue; }
            if (outcome(name) !== 'success') throw new Error(`${lane} CI required job ${name} concluded ${outcome(name) ?? 'missing'}`);
          }
          for (const name of excluded) {
            if (outcome(name) !== 'skipped') throw new Error(`${lane} CI excluded job ${name} concluded ${outcome(name) ?? 'missing'}`);
          }
          console.log(`Merge Gate passed: ${lane} CI`);
          NODE
