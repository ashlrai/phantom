name: Custody helper

on:
  # Runs when custody sources change on master, plus a weekly run to catch
  # macOS image or Swift toolchain drift. Never per PR (CI-PHANTOM-DAILY-CRONS:
  # zero commits touched these paths in the 30 days before Nov 16 2026, yet the
  # daily macOS run kept firing).
  push:
    branches: [master]
    paths:
      - "tools/custody/**"
      - "scripts/install-custody.sh"
      - ".github/workflows/custody.yml"
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custody-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Custody (macOS, Swift)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test custody contracts without hardware or credentials
        run: swift test --package-path tools/custody
      - name: Compile the macOS security adapters
        run: swift build -c release --package-path tools/custody
      - name: Check installer syntax
        run: bash -n scripts/install-custody.sh

# These checks compile the OS adapters and exercise injected contract tests.
# They never install the helper, authenticate a person, read Keychain secrets,
# or activate a grant. Real device acceptance remains a separate operator step.
