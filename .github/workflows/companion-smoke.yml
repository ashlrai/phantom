name: Companion Smoke

# Runs scripts/companion-workflow-smoke.mjs --published against what users
# install from npm and GitHub releases. Every hour it reads the published
# companion versions; the smoke runs only when that set (or the smoke script)
# changed since the last run, so a companion release is checked within the hour
# and quiet hours cost one lookup. A daily run and workflow_dispatch always run,
# which also covers Cortex, whose deployments have no version to watch.

on:
  schedule:
    - cron: "23 * * * *"
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-smoke
  cancel-in-progress: false

jobs:
  published:
    name: Published companion smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      CORTEX_MCP_URL: https://cortex.ashlr.ai/api/mcp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Read published companion versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packages=$(node --input-type=module -e "const m = await import('./scripts/companion-workflow-smoke.mjs'); console.log(m.PUBLISHED_PACKAGES.map(p => p.name).join(' '))")
          : > companion-versions.txt
          for name in $packages; do
            echo "$name@$(npm view "$name" version 2>/dev/null || echo unpublished)" >> companion-versions.txt
          done
          md=$(curl -fsS -H "authorization: Bearer $GH_TOKEN" https://api.github.com/repos/ashlrai/ashlr-md/releases/latest | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>console.log(JSON.parse(s).tag_name))" || echo unknown)
          echo "ashlr-md@$md" >> companion-versions.txt
          sha256sum scripts/companion-workflow-smoke.mjs | cut -d' ' -f1 | sed 's/^/smoke@/' >> companion-versions.txt
          cat companion-versions.txt
          echo "key=companion-smoke-v1-$(sha256sum companion-versions.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Look up an earlier run of this version set
        id: seen
        if: github.event_name == 'schedule' && github.event.schedule == '23 * * * *'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: companion-versions.txt
          key: ${{ steps.versions.outputs.key }}
          lookup-only: true

      - name: Set up Bun (Ashlr.AI Plugin router)
        if: steps.seen.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install ripgrep (Ashlr.AI Plugin router)
        if: steps.seen.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Build Phantom (the smoke reads Phantom's own Locus parsers from dist)
        if: steps.seen.outputs.cache-hit != 'true'
        run: npm ci && npm run build

      - name: Run the published smoke
        if: steps.seen.outputs.cache-hit != 'true'
        run: |
          set -uo pipefail
          node scripts/companion-workflow-smoke.mjs --published --cortex-url "$CORTEX_MCP_URL" | tee smoke.txt
          status=${PIPESTATUS[0]}
          {
            echo "### Published companion smoke"
            echo
            echo '```'
            cat companion-versions.txt
            echo
            cat smoke.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Saved whatever the outcome, so one broken release fails one hourly run
      # rather than every hour; the daily run keeps re-checking it.
      - name: Remember this version set
        if: always() && steps.seen.outcome == 'success' && steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: companion-versions.txt
          key: ${{ steps.versions.outputs.key }}
