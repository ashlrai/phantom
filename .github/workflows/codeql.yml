name: CodeQL

# This repository has no merge queue, so a merge_group-only workflow never
# runs. Push to master is what runs the scan between the nightly cron and a
# manual run. No pull_request trigger. The nightly minute is 53 past 08:00
# UTC so it does not share a minute with CI (41 7), companion smoke (41 6),
# the dependency audit (17 9), or the ashlr-md CodeQL pilot (17 6).
on:
  merge_group:
  push:
    branches: [master]
  schedule:
    - cron: "53 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift is present under tools/custody, and CodeQL has no build-mode
          # none for it. A Swift compile is not added to the merge queue.
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
