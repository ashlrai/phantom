# Finalizes only an existing, completely stocked, signed Phantom draft.
# No npm mutation, release creation, asset upload, tag or runtime authority.
name: Finalize GitHub stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable Phantom version (existing draft required)
        required: true
        type: string
      publish_run_id:
        description: Successful publish-canonical-npm workflow run ID
        required: true
        type: string
      publish_run_attempt:
        description: Successful canonical npm run attempt
        required: true
        type: string
      candidate_sha:
        description: Exact shipped candidate commit (not the workflow source SHA)
        required: true
        type: string
      candidate_integrity:
        description: Accepted sha512 SRI for this Phantom version
        required: true
        type: string
      confirm_stable_finalization:
        description: Confirm the signed seven-asset draft should become stable/latest
        required: true
        default: false
        type: boolean

permissions: {}
# Shared across versions: two drafts must never race to overwrite latest.
concurrency:
  group: phantom-github-stable-finalization
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
  PUBLISH_RUN_ATTEMPT: ${{ inputs.publish_run_attempt }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  CANDIDATE_INTEGRITY: ${{ inputs.candidate_integrity }}
  CONFIRM_STABLE_FINALIZATION: ${{ inputs.confirm_stable_finalization }}

jobs:
  verify:
    if: github.ref == 'refs/heads/master' && github.repository == 'ashlrai/phantom'
    name: Verify signed stable-finalization evidence (NO_MUTATION_AUTHORITY)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      receipt_sha256: ${{ steps.verification.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install protected-source verifier dependencies without lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned npm signature verifier
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 'https://registry.npmjs.org/npm/-/npm-11.21.0.tgz' > "$RUNNER_TEMP/npm-cli.tgz"
          node --input-type=module -e 'import fs from "node:fs"; import {createHash} from "node:crypto"; if(createHash("sha512").update(fs.readFileSync(process.env.RUNNER_TEMP+"/npm-cli.tgz")).digest("base64")!=="Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg==")throw Error("npm tool integrity differs");'
          npm install --global "$RUNNER_TEMP/npm-cli.tgz" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          test "$(npm --version)" = '11.21.0'
      - name: Resolve exact successful canonical npm admission
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/finalize-github-release.mjs prepare --json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/finalizer-admission
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.publish_run_id }}
          merge-multiple: true
          digest-mismatch: error
      - name: Verify provenance and every signed draft asset
        id: verification
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_ARTIFACT_ID: ${{ steps.prepare.outputs.artifact_id }}
        run: node --import tsx scripts/finalize-github-release.mjs verify --json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-stable-finalization-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.verification.outputs.receipt }}
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false

  finalize:
    if: github.ref == 'refs/heads/master' && github.repository == 'ashlrai/phantom'
    name: Perform one protected draft-to-published PATCH
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: github-stable-release-finalization
    permissions:
      actions: read
      contents: write
    steps:
      # No checkout, candidate execution or dependency installation with write authority.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-stable-finalization-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: finalization-preflight
          digest-mismatch: error
      - name: Reverify live state, perform one PATCH, and postverify
        id: finalization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RECEIPT_SHA256: ${{ needs.verify.outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          receipt=finalization-preflight/github-stable-finalization-preflight.json
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/master && "$GITHUB_REPOSITORY" == ashlrai/phantom ]]
          [[ "$CONFIRM_STABLE_FINALIZATION" == true && "$EXPECTED_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(find finalization-preflight -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" == 1 ]]
          test -f "$receipt" && test ! -L "$receipt"
          test "$(stat --format='%h' "$receipt")" = 1
          test "$(wc -c < "$receipt")" -le 16384
          [[ "$(sha256sum "$receipt" | cut -d ' ' -f 1)" == "$EXPECTED_RECEIPT_SHA256" ]]
          jq -e --arg version "$VERSION" --arg candidate "$CANDIDATE_SHA" --arg integrity "$CANDIDATE_INTEGRITY" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" \
            --arg publish "$PUBLISH_RUN_ID" --arg publishAttempt "$PUBLISH_RUN_ATTEMPT" \
            '.schemaVersion == 2 and .admission == "phantom-stable-finalization" and
             .input.version == $version and .input.tag == ("v" + $version) and
             .input.candidateSha == $candidate and .input.integrity == $integrity and
             .input.publishRun == ($publish|tonumber) and .input.publishAttempt == ($publishAttempt|tonumber) and
             .input.workflowSha == $sha and .input.workflowRun == ($run|tonumber) and .input.workflowAttempt == ($attempt|tonumber) and
             .npmMutationAuthority == false and .installAuthority == false and .activationAuthority == false and
             .githubReleaseMutationExecuted == false and
             ((now - (.verifiedAt|fromdateiso8601)) >= 0) and ((now - (.verifiedAt|fromdateiso8601)) <= 3600)' "$receipt" >/dev/null
          release_id="$(jq -er '.release.id | numbers' "$receipt")"
          tag="$(jq -er '.input.tag' "$receipt")"
          artifact_id="$(jq -er '.evidence.artifactId | numbers' "$receipt")"
          gh api "repos/$GITHUB_REPOSITORY/environments/github-stable-release-finalization" > "$RUNNER_TEMP/environment.json"
          jq -e '([.protection_rules[]? | select(.type == "required_reviewers")]) as $rules |
            .name == "github-stable-release-finalization" and .can_admins_bypass == false and
            .deployment_branch_policy.protected_branches == true and .deployment_branch_policy.custom_branch_policies == false and
            ($rules|length) == 1 and $rules[0].prevent_self_review == false and
            ($rules[0].reviewers|length) == 1 and $rules[0].reviewers[0].type == "User" and
            $rules[0].reviewers[0].reviewer.login == "masonwyatt23"' "$RUNNER_TEMP/environment.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/branches/master" | jq -e --arg sha "$GITHUB_SHA" '.protected == true and .commit.sha == $sha' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/compare/$CANDIDATE_SHA...$GITHUB_SHA" | jq -e '.status == "ahead" or .status == "identical"' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN_ID/attempts/$PUBLISH_RUN_ATTEMPT" > "$RUNNER_TEMP/publisher.json"
          jq -e --slurpfile receipt "$receipt" '.id == $receipt[0].input.publishRun and .run_attempt == $receipt[0].input.publishAttempt and
            .path == ".github/workflows/publish-canonical-npm.yml" and .event == "workflow_dispatch" and .head_branch == "master" and
            .head_sha == $receipt[0].evidence.publisherSha and .repository.id == 1263526319 and .repository.full_name == "ashlrai/phantom" and
            .repository.owner.id == 258113726 and .status == "completed" and .conclusion == "success"' "$RUNNER_TEMP/publisher.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISH_RUN_ID/attempts/$PUBLISH_RUN_ATTEMPT/jobs?per_page=100" | \
            jq -e --slurpfile receipt "$receipt" '.total_count == 4 and (.jobs|length) == 4 and
              ([.jobs[].name]|sort) == ["admit","consumer","promote","publish"] and
              all(.jobs[]; .status == "completed" and .conclusion == "success" and
                .run_id == $receipt[0].input.publishRun and .head_sha == $receipt[0].evidence.publisherSha)' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" | jq -e --slurpfile receipt "$receipt" \
            '.id == $receipt[0].evidence.artifactId and .digest == $receipt[0].evidence.artifactDigest and .expired == false and
             .workflow_run.id == $receipt[0].input.publishRun and .workflow_run.head_sha == $receipt[0].evidence.publisherSha and
             .name == ("phantom-npm-admitted-" + ($receipt[0].input.publishRun|tostring) + "-" + ($receipt[0].input.publishAttempt|tostring))' >/dev/null
          curl --fail --silent --show-error --max-time 30 --max-filesize 33554432 'https://registry.npmjs.org/@ashlr%2Fphantom' | \
            jq -e --arg version "$VERSION" --arg integrity "$CANDIDATE_INTEGRITY" \
              '.name == "@ashlr/phantom" and .["dist-tags"].latest == $version and .versions[$version].dist.integrity == $integrity' >/dev/null
          verify_tag() {
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > "$RUNNER_TEMP/tag.json" || return 1
            jq -e --arg ref "refs/tags/$tag" '.ref == $ref' "$RUNNER_TEMP/tag.json" >/dev/null || return 1
            for depth in 0 1 2 3 4; do
              kind="$(jq -er '.object.type' "$RUNNER_TEMP/tag.json")" || return 1
              target="$(jq -er '.object.sha' "$RUNNER_TEMP/tag.json")" || return 1
              [[ "$target" =~ ^[a-f0-9]{40}$ ]] || return 1
              if [[ "$kind" == commit ]]; then
                [[ "$target" == "$CANDIDATE_SHA" ]] || return 1
                return 0
              fi
              [[ "$kind" == tag && "$depth" -lt 4 ]] || return 1
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$target" > "$RUNNER_TEMP/tag.json" || return 1
              jq -e --arg sha "$target" '.sha == $sha' "$RUNNER_TEMP/tag.json" >/dev/null || return 1
            done
            return 1
          }
          verify_release() {
            local expected_draft="$1"
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release.json" || return 1
            jq -e --slurpfile receipt "$receipt" --argjson draft "$expected_draft" '.id == $receipt[0].release.id and
              .tag_name == $receipt[0].input.tag and .target_commitish == $receipt[0].input.candidateSha and
              .name == $receipt[0].release.name and .draft == $draft and .prerelease == false and .immutable == false' "$RUNNER_TEMP/release.json" >/dev/null || return 1
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" > "$RUNNER_TEMP/assets.json" || return 1
            jq -e 'length == 7 and ([.[].id]|unique|length) == 7 and all(.[]; .state == "uploaded")' "$RUNNER_TEMP/assets.json" >/dev/null || return 1
            jq -j '.body' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/body.txt" || return 1
            jq -cj 'sort_by(.id) | map({id,name,label:.label,content_type,size,state,digest,browser_download_url})' "$RUNNER_TEMP/assets.json" > "$RUNNER_TEMP/assets-snapshot.json" || return 1
            # Explicit returns keep every predicate fail-closed across Bash versions.
            [[ "$(sha256sum "$RUNNER_TEMP/body.txt" | cut -d ' ' -f 1)" == "$(jq -er '.release.bodySha256' "$receipt")" ]] || return 1
            [[ "$(sha256sum "$RUNNER_TEMP/assets-snapshot.json" | cut -d ' ' -f 1)" == "$(jq -er '.release.assetsSha256' "$receipt")" ]] || return 1
          }
          # List endpoint includes drafts. Refuse a duplicate or a concurrently
          # published row for this tag rather than creating/replacing anything.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          jq -se --arg tag "$tag" --argjson id "$release_id" \
            '[.[][] | select(.tag_name == $tag)] | length == 1 and .[0].id == $id and .[0].draft == true' "$RUNNER_TEMP/releases.json" >/dev/null
          verify_tag
          verify_release true
          jq -cn '{draft:false, make_latest:"true"}' > "$RUNNER_TEMP/patch.json"
          # Sole external mutation. Never replay on an ambiguous response.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" --input "$RUNNER_TEMP/patch.json" > "$RUNNER_TEMP/patch-result.json"
          verify_tag
          verify_release false
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" | jq -e --argjson id "$release_id" --arg tag "$tag" \
            '.id == $id and .tag_name == $tag and .draft == false and .prerelease == false' >/dev/null
          curl --fail --silent --show-error --location --proto '=https' --max-time 30 --max-filesize 131072 \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" > "$RUNNER_TEMP/latest.json"
          [[ "sha256:$(sha256sum "$RUNNER_TEMP/latest.json" | cut -d ' ' -f 1)" == "$(jq -er '.[] | select(.name == "latest.json") | .digest' "$RUNNER_TEMP/assets.json")" ]]
          jq -cn --slurpfile receipt "$receipt" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:2,effect:"github-release-draft-finalization",release:$receipt[0].release,input:$receipt[0].input,
              evidence:$receipt[0].evidence,finalizedAt:$at,mutation:{method:"PATCH",count:1,fields:{draft:false,make_latest:"true"}},
              githubReleaseMutationExecuted:true,npmMutationAuthority:false,installAuthority:false,activationAuthority:false}' > "$RUNNER_TEMP/github-stable-finalization.json"
          echo 'Finalized signed Phantom draft; installed-app update and launch remain unverified.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-stable-release-finalization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-stable-finalization.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
