# Weekly record of the scheduled full-run pass rate and the time from the
# tagged commit's committer date to the release published_at. Read-only apart
# from the uploaded JSON artifact. It does not create, move, or edit tags,
# drafts, or releases, and it is not a required check.
name: Release flow metrics

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-flow-metrics
  cancel-in-progress: false

jobs:
  record:
    if: github.repository == 'ashlrai/phantom' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master')
    name: Record release flow metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.3"
      - name: Test metrics math
        run: node --test .github/tests/ci-release-metrics.test.mjs
      - name: Record the window
        env:
          GH_TOKEN: ${{ github.token }}
          METRICS_ROLE: scheduled
        run: node .github/scripts/ci-release-metrics.mjs --write .github/metrics/release-flow.json
      - name: Upload release flow metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-flow-metrics
          path: .github/metrics/release-flow.json
          if-no-files-found: error
          retention-days: 90
