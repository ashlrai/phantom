# Auto-tag: create v<version> and its draft GitHub release when the version in
# package.json on master is untagged and every required check for that exact
# commit is green and its release gate is green (RELEASE_GATE_MODE: 'full' =
# latest six-hour scheduled full CI green, the default; 'split' = release-relevant
# suites green on the exact SHA, see RELEASE-GATE-SPLIT-1). A missing
# tag is owed even when the bump landed earlier, so this heals a stranded release instead of waiting for the next bump.
# Tags and releases are created only here, with the ashlr-release GitHub App
# token. The release starts as a draft: releases/latest keeps resolving to the
# last fully stocked feed until scripts/publish-desktop-release.mjs attaches
# the signed artifacts and publishes it. release-please (if present) only opens
# version PRs and never creates tags or releases.
#
# Required checks are discovered at run time from the branch rules API
# (rulesets) unioned with classic branch protection contexts. Fail closed:
# - no required checks discovered: fail
# - only GitHub Actions check runs (app id 15368) count; every latest run with
#   a required name must be completed + success; commit statuses never count
# - a required check missing, queued or in progress: bounded wait (~9.5 min),
#   then no tag (notice on the push trigger; failure on workflow_run/dispatch)
# - any conclusion other than success: fail at once. skipped and neutral are NOT
#   green: required checks here use the skip-job pattern (phantom #811),
#   which reports success, so a skipped required check means it did not run.
# - "Check generated files" and "Check authority drift (hermetic)" are always
#   required on the exact sha in addition to the discovered checks, even though
#   the second is advisory for merge (RQ-PH-GATE-SPLIT-1).
# Release prep dispatches the release-gate CI run with GITHUB_TOKEN, which does
# not produce a workflow_run event. After both release-gate jobs succeed, CI
# explicitly dispatches this workflow with the exact candidate SHA.
name: Auto-tag

on:
  push:
    branches: [master]
    paths: ["package.json"]
  # Desktop release smoke and Release suites are jobs in CI. For CI runs that
  # produce a workflow_run event, evaluate workflow_run.head_sha. Release prep's
  # GITHUB_TOKEN dispatch is handled by CI's explicit exact-SHA dispatch below.
  # Release prep starts that CI run on the master push and again every five
  # minutes, deduped per sha, so a missed push is retried without a second build.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "22,52 * * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: Exact release-gated master commit to evaluate
        required: false
        type: string
        default: ''

permissions: {}

# One evaluation per commit. A second completion for the same sha waits, then
# the version step no-ops once the tag and its release both exist.
concurrency:
  group: auto-tag-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'workflow_dispatch' && inputs.sha != '' && inputs.sha) || github.sha }}
  cancel-in-progress: false

jobs:
  tag:
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'ashlrai/phantom' && github.event.workflow_run.head_branch == 'master' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read     # read check-runs for the exact commit
      actions: write   # dispatch release-gate CI with GITHUB_TOKEN
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: master
      VERSION_FILE: package.json
      SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'workflow_dispatch' && inputs.sha != '' && inputs.sha) || github.sha }}
      # RELEASE-GATE-SPLIT-2: a dispatched master CI run (release_gate=true
      # release prep) explicitly dispatches this workflow after both release
      # jobs succeed, passing the exact SHA. GitHub does not emit workflow_run
      # for the GITHUB_TOKEN dispatch, so do not rely on that trigger for it.
      # A workflow_run for a push-event CI run evaluates a fresh master commit
      # that cannot have its own scheduled full yet, so it holds quietly like a
      # direct push. Only schedule-sourced workflow_run, schedule and dispatch
      # fail closed (the scheduled full re-evaluates the held commit).
      TRIGGER: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && 'push' || github.event_name }}
      # SKIP_OK is unused (empty). A skipped required check is red, except
      # Check generated files, Check authority drift (hermetic) and Quick
      # typecheck, which may be skipped only when another latest run of the
      # same exact name on this SHA is completed + success. Merge Gate,
      # Secret-shape scan and Secret scan (diff) always treat skipped as red.
      SKIP_OK: ""
      ACTIONS_APP_ID: "15368"   # GitHub Actions; other apps' same-named runs never count
    steps:
      - name: Validate explicit dispatch SHA
        id: validate-dispatch-sha
        if: github.event_name == 'workflow_dispatch' && inputs.sha != ''
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::invalid sha input; expected a lowercase 40-character commit SHA"
            exit 1
          }
          status=$(gh api "repos/$REPO/compare/$CANDIDATE_SHA...master" -q .status)
          case "$status" in
            ahead|identical) ;;
            *) echo "::error::sha input is not an ancestor of current master (compare status: $status)"; exit 1 ;;
          esac
      # GATES v4: preflight must not use workflow_run. Start it here, on
      # master, with the job token this workflow already holds. A dispatch
      # failure does not block the tag.
      - name: Start preflight fixer on master
        continue-on-error: true
        run: |
          set -euo pipefail
          gh api --method POST "repos/${REPO}/actions/workflows/preflight-fixer.yml/dispatches" --input - <<'EOF'
          {"ref":"master"}
          EOF
      - name: Detect version change
        id: version
        shell: bash
        run: |
          set -euo pipefail
          read_version() {
            gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/$VERSION_FILE?ref=$1" | jq -r .version
          }
          parent=$(gh api "repos/$REPO/commits/$SHA" -q '.parents[0].sha')
          new=$(read_version "$SHA")
          old=$(read_version "$parent" || echo none)
          [[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected version '$new'"; exit 1; }
          # Existence first: an untagged version on master is owed its tag even
          # when the bump landed earlier (a merge that carried no checks used
          # to leave the tag stranded forever). The release leg is owed too: a
          # tag whose GitHub release was never created (or whose creation step
          # failed) still owes the draft, so "nothing to do" requires BOTH.
          # releases/tags/<tag> returns published releases only — drafts 404
          # here, and this read-only token could not list them anyway. A lone
          # draft falls through to the tag step, whose script finds it through
          # the write-scoped list endpoint and reuses it.
          if git ls-remote --exit-code --tags "https://github.com/$REPO.git" "refs/tags/v$new" >/dev/null && \
             gh api "repos/$REPO/releases/tags/v$new" >/dev/null 2>&1; then
            echo "Tag v$new and its release already exist; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$new" = "$old" ]; then
            echo "Version unchanged ($new) but tag v$new is missing; tagging this commit."
          else
            echo "Version bumped $old -> $new; tagging this commit."
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Require every required check green on this exact commit
        id: checks
        if: steps.version.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          required=$( {
            gh api "repos/$REPO/rules/branches/$BRANCH" -q '.[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context'
            gh api "repos/$REPO/branches/$BRANCH" -q '.protection.required_status_checks.contexts[]?'
          } | sort -u )
          if [ -z "$required" ]; then
            echo "::error::no required checks discovered for $BRANCH; refusing to tag"; exit 1
          fi
          # RQ-PH-GATE-SPLIT-1: Merge Gate does not cover the advisory authority
          # drift job, and a failed generated-files job once let a tag through.
          # Both split jobs must also be completed + success on this exact sha,
          # with the same rules as every discovered check (skipped is red,
          # except Check generated files, Check authority drift (hermetic)
          # and Quick typecheck when a same-sha success run exists; missing
          # or running waits within the bounded loop, then no tag).
          required=$( { printf '%s\n' "$required" "Check generated files" "Check authority drift (hermetic)"; } | sort -u )
          # One evaluation pass. Check runs: only GitHub Actions (app id
          # $ACTIONS_APP_ID) counts, and EVERY latest run with the required name
          # must be completed + success. Commit statuses are ignored: a required
          # name with no app-15368 check run is missing.
          evaluate() {
            runs=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?filter=latest&app_id=$ACTIONS_APP_ID&per_page=100"               -q '.check_runs[] | select(.app.id == '"$ACTIONS_APP_ID"') | [.name, .status, (.conclusion // "")] | @tsv')
            pending=0; bad=0
            while IFS= read -r name; do
              rows=$(awk -F'	' -v n="$name" '$1==n' <<<"$runs")
              if [ -n "$rows" ]; then
                while IFS=$'	' read -r _ status conclusion; do
                  if [ "$status" != completed ]; then echo "pending: $name ($status)"; pending=1
                  elif [ "$conclusion" = success ]; then echo "green: $name"
                  elif [ "$conclusion" = skipped ] && [ -n "$SKIP_OK" ] && [ "$name" = "$SKIP_OK" ]; then echo "skipped by design on push: $name"
                  # RELEASE-GATE-SPLIT-3: a dispatched release prep on this
                  # master SHA reports these push/PR-scoped jobs as skipped.
                  # A skipped run is accepted only for an exact-name case on
                  # Check generated files, Check authority drift (hermetic)
                  # and Quick typecheck, and only when another latest run of
                  # the same name on this exact SHA is completed + success.
                  # Every other required name, including Merge Gate,
                  # Secret-shape scan and Secret scan (diff), treats skipped as red.
                  elif [ "$conclusion" = skipped ]; then
                    case "$name" in
                      "Check generated files"|"Check authority drift (hermetic)"|"Quick typecheck")
                        if awk -F'	' 'BEGIN{f=1} $2=="completed" && $3=="success"{f=0} END{exit f}' <<<"$rows"; then echo "skipped on another event, green run present: $name"
                        else echo "::error::not green: $name ($conclusion)"; bad=1; fi ;;
                      *)
                        echo "::error::not green: $name ($conclusion)"; bad=1 ;;
                    esac
                  else echo "::error::not green: $name ($conclusion)"; bad=1; fi
                done <<<"$rows"
                continue
              fi
              echo "missing: $name (no GitHub Actions check run; commit statuses never satisfy a required check)"; pending=1
            done <<<"$required"
          }
          # Bounded wait while checks are pending or not yet reported:
          # about 9.5 minutes total, then decide. Failures stop at once.
          for delay in 0 20 40 60 90 120 120 120; do
            sleep "$delay"
            evaluate
            if [ "$bad" = 1 ]; then exit 1; fi
            if [ "$pending" = 0 ]; then echo "green=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          if [ "$TRIGGER" = push ]; then
            echo "::notice::required checks still not finished; the workflow_run trigger re-evaluates after CI"
            echo "green=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::error::required checks missing or pending after CI completed and a bounded wait; refusing to tag"; exit 1

      - name: Checkout candidate revision
        if: steps.checks.outputs.green == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      # Fail closed before minting write authority. RELEASE-GATE-SPLIT-1:
      # RELEASE_GATE_MODE unset or 'full' keeps the scheduled-full requirement
      # (ci-master-full.mjs, unchanged). 'split' requires the release-relevant
      # suites green on this exact SHA (build, typecheck, fast gate, desktop
      # release smoke, signing path); the six-hour full suite then files P0
      # fix-forward lines instead of blocking. Step id stays 'full' so every
      # later step keeps its existing guard.
      - name: Require release gate on this exact commit
        id: full
        if: steps.checks.outputs.green == 'true'
        env:
          RELEASE_GATE_MODE: ${{ vars.RELEASE_GATE_MODE }}
        run: node .github/scripts/ci-release-gate.mjs require

      - name: Mint ashlr-release App token (contents write, this repo only)
        id: app
        if: steps.checks.outputs.green == 'true' && steps.full.outputs.green == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.ASHLR_RELEASE_APP_ID }}
          private-key: ${{ secrets.ASHLR_RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # One step creates the tag then the DRAFT GitHub release — the train leg
      # that used to depend on someone doing it by hand. The release stays a
      # draft so releases/latest keeps serving the last complete feed until the
      # sanctioned local publisher attaches the signed artifacts.
      - name: Create tag v${{ steps.version.outputs.version }} and its draft release
        if: steps.checks.outputs.green == 'true' && steps.full.outputs.green == 'true'
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          result=$(node .github/scripts/tag-github-release.mjs)
          printf '%s\n' "$result"
          echo "release=$(printf '%s' "$result" | jq -r .release)" >> "$GITHUB_OUTPUT"

      # ci.yml has no on.push.tags trigger, and a GITHUB_TOKEN tag would not
      # fire one anyway. When this leg just created the draft, dispatch the
      # release-gate build on the tag ref with the job GITHUB_TOKEN. The App
      # token stays contents-only so the tag can still trigger downstream
      # workflows. Do not request actions on the App mint: the installation
      # lacks that permission and the token request would 422.
      - name: Dispatch release-gate CI on the new tag
        if: steps.checks.outputs.green == 'true' && steps.full.outputs.green == 'true' && steps.tag.outputs.release == 'draft-created'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" --input - <<EOF
          {"ref":"v${VERSION}","inputs":{"release_gate":"true"}}
          EOF
