<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc">
  <title id="title">Phantom — One workbench. Your whole engineering fleet.</title>
  <desc id="desc">An illustrative fleet board connects a shared queue to cloud, local, and remote agent lanes, then to a laptop, workstation, and remote node. This is a schematic, not a live product capture.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ink { fill: #FFFFFF; } .muted { fill: #A3B3C3; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; letter-spacing: 1px; }
    .rule { fill: none; stroke: #476787; stroke-opacity: .5; }
    .card { fill: #152330; stroke: #476787; stroke-opacity: .6; }
  </style>
  <rect width="1500" height="800" fill="#0D1520"/>
