# Copy to ~/.ashlr/org.toml. Metadata only: ids, lanes, shares and reporting lines.
# No tokens, mail or messages belong here; each member signs in to their own provider CLIs.
version = 1
leader = "mason-wyatt"

[[members]]
id = "mason-wyatt"
name = "Mason Wyatt"
role = "founder"
machines = [{ id = "mason-mac" }]
contributions = [
  { lane = "claude", share = 100, pool = "claude-max" },
  { lane = "codex-personal", share = 100, pool = "codex-personal" },
]
agents = [
  { id = "leader", lane = "claude", machine = "mason-mac", roles = ["leader"] },
  { id = "mason-claude-1", lane = "claude", machine = "mason-mac", roles = ["implementer", "reviewer"], reports_to = "leader" },
  { id = "mason-claude-2", lane = "claude", machine = "mason-mac", roles = ["implementer", "reviewer"], reports_to = "leader" },
  { id = "mason-codex-1", lane = "codex-personal", machine = "mason-mac", roles = ["implementer"], reports_to = "leader" },
]

